# litellm-cost-heartbeat CronJob — 每分钟消耗少量 LiteLLM/Bedrock 费用
# 用途: 持续产生带 team/key Session Tag 的真实 Bedrock 流量，验证按小时计费可见。
# 部署: kubectl apply -f docs/litellm/litellm_cost/litellm-cost-heartbeat.yaml
# 停用: kubectl patch cronjob litellm-cost-heartbeat -n litellm -p '{"spec":{"suspend":true}}'
# 删除: kubectl delete cronjob litellm-cost-heartbeat -n litellm
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-cost-heartbeat
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm-cost-heartbeat
spec:
  schedule: "* * * * *"            # 每分钟
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app.kubernetes.io/name: litellm-cost-heartbeat
        spec:
          restartPolicy: Never
          containers:
            - name: heartbeat
              image: python:3.12-slim
              command: ["python3", "-c"]
              args:
                - |
                  import os,json,urllib.request
                  key=os.environ["LITELLM_KEY"]
                  body=json.dumps({"model":"claude-haiku-4-5-20251001",
                    "messages":[{"role":"user","content":"ping"}],"max_tokens":5}).encode()
                  req=urllib.request.Request("http://litellm.litellm.svc.cluster.local:4000/v1/chat/completions",
                    data=body,headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},method="POST")
                  d=json.loads(urllib.request.urlopen(req,timeout=40).read())
                  u=d.get("usage",{})
                  print("heartbeat OK model=%s tokens=%s/%s"%(d.get("model"),u.get("prompt_tokens"),u.get("completion_tokens")))
              env:
                - name: LITELLM_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-cron-heartbeat
                      key: key
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits:   {cpu: 200m, memory: 128Mi}
