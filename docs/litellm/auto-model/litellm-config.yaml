general_settings:
  allow_requests_on_db_unavailable: true
  database_connection_pool_limit: 24
  disable_error_logs: true
  forward_client_headers_to_llm_api: false
  master_key: os.environ/PROXY_MASTER_KEY
  maximum_spend_logs_retention_period: 7d
  proxy_batch_write_at: 30
  store_prompts_in_spend_logs: true
  max_parallel_requests: 100
  global_max_parallel_requests: 500

litellm_settings:
  cache: true
  cache_params:
    host: valkey.example.internal
    password: os.environ/REDIS_PASSWORD
    port: 6379
    ssl: true
    ttl: 600
    type: redis
  drop_params: true
  json_logs: true
  request_timeout: 600
  set_verbose: false
  callbacks:
    - custom_callbacks.proxy_handler_instance

model_list:
  # ───────── Frontier Anthropic (complex reasoning tier) ─────────
  - model_name: claude-opus-4-7
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-7
  - model_name: claude-opus-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-6-v1
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
  - model_name: claude-sonnet-4-5-20250929
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
  - model_name: claude-opus-4-5-20251101
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-5-20251101-v1:0
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0

  # ───────── Cheap coder tier (open-weight, in us-west-2) ─────────
  - model_name: qwen3-coder-480b
    litellm_params:
      model: bedrock/qwen.qwen3-coder-480b-a35b-v1:0
      aws_region_name: us-west-2

  # ───────── Open-weight alternatives exposed as picker aliases ─────────
  - model_name: kimi-k2.5
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      aws_region_name: us-west-2

  - model_name: zai.glm-5
    litellm_params:
      model: bedrock/zai.glm-5
      aws_region_name: us-west-2

  - model_name: deepseek-v3.2
    litellm_params:
      model: bedrock/deepseek.v3.2
      aws_region_name: us-west-2

  # ───────── Embedding model for the semantic router ─────────
  - model_name: bedrock-embed-v4
    litellm_params:
      model: bedrock/global.cohere.embed-v4:0

  # ───────── Auto Router entrypoint ─────────
  # Clients call model="auto" and LiteLLM picks one of the four tiers
  # above by embedding-cosine match against /etc/litellm/semantic_router.json.
  - model_name: auto
    litellm_params:
      model: auto_router/coding_auto_v1
      auto_router_config_path: /etc/litellm/semantic_router.json
      auto_router_default_model: claude-haiku-4-5-20251001
      auto_router_embedding_model: bedrock-embed-v4

  # ───────── Catch-all passthrough (existing behaviour, preserved) ─────────
  - model_name: bedrock/*
    litellm_params:
      model: bedrock/*
      aws_region_name: us-west-2

router_settings:
  redis_host: valkey.example.internal
  redis_password: os.environ/REDIS_PASSWORD
  redis_port: 6379
  routing_strategy: simple-shuffle
