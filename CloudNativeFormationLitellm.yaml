  # ============================================================================
  # SECTION 9: GLOBAL ACCELERATOR
  # ============================================================================

  GlobalAccelerator:
    Type: AWS::GlobalAccelerator::Accelerator
    DependsOn: QuotaCheck
    Properties:
      Name: !Sub "${ProjectName}${EnvironmentId}"
      IpAddressType: DUAL_STACK
      Enabled: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}${EnvironmentId}-ga"

  GAListener443:
    Type: AWS::GlobalAccelerator::Listener
    Properties:
      AcceleratorArn: !Ref GlobalAccelerator
      Protocol: TCP
      PortRanges:
        - FromPort: 443
          ToPort: 443

  GAEndpointGroup443:
    Type: AWS::GlobalAccelerator::EndpointGroup
    Properties:
      ListenerArn: !Ref GAListener443
      EndpointGroupRegion: !Ref "AWS::Region"
      EndpointConfigurations:
        - EndpointId: !GetAtt NlbLookup.NlbArn
          ClientIPPreservationEnabled: true
          Weight: 100

  GAListener80:
    Type: AWS::GlobalAccelerator::Listener
    Properties:
      AcceleratorArn: !Ref GlobalAccelerator
      Protocol: TCP
      PortRanges:
        - FromPort: 80
          ToPort: 80

  GAEndpointGroup80:
    Type: AWS::GlobalAccelerator::EndpointGroup
    Properties:
      ListenerArn: !Ref GAListener80
      EndpointGroupRegion: !Ref "AWS::Region"
      EndpointConfigurations:
        - EndpointId: !GetAtt NlbLookup.NlbArn
          ClientIPPreservationEnabled: true
          Weight: 100

  # ============================================================================
  # SECTION 10: KUBERNETES APP RESOURCES (Test Pod + Routes + OIDC Policy)
  # ============================================================================

  EfsCsiPodIdentityAssoc:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: AddonEfsCsi
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      ServiceAccount: efs-csi-controller-sa
      RoleArn: !GetAtt EfsCsiRole.Arn

  LiteLLMPodIdentityAssoc:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: AddonEfsCsi
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: litellm
      ServiceAccount: litellm-sa
      RoleArn: !GetAtt PodRole.Arn

  # Placeholder - maintains dependency chain for GAHttpsSetup
  K8sAppResources:
    Type: Custom::K8sApp
    DependsOn:
      - K8sInfraResources
      - NlbLookup
      - AuroraInstance
    Properties:
      ServiceToken: !GetAtt KubectlFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      Manifests:
        # --- LiteLLM Namespace ---
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: litellm
        # --- LiteLLM ServiceAccount (IRSA via Pod Identity) ---
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: litellm-sa
            namespace: litellm
        # --- LiteLLM PostgreSQL credentials Secret ---
        - apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-creds
            namespace: litellm
          type: Opaque
          stringData:
            username: pgadmin
            password: !Sub "${ProjectName}${EnvironmentId}Pg2026!"
        # --- LiteLLM master-key Secret (strong, unguessable, per-stack) ---
        # A master key is REQUIRED: LiteLLM signs the SSO UI-session JWT with it
        # (HS256), and an empty key makes SSO login impossible (PyJWT rejects an
        # empty HMAC key). The original security risk was a *hardcoded, public*
        # key (sk-litellm-proxy-master-key) — anyone could use it. We instead
        # derive a strong random key from the CloudFormation StackId GUID (unique
        # per deployment, not in source), and — critically — restrict what the
        # master key may DO via access_policy.py below: it becomes read-only
        # (usage/stats), and CANNOT call models or create/modify keys. Those
        # need a virtual key (SSO UI session key, or one created in the UI). The
        # chart reads this Secret via masterkeySecretName (LiteLLMDeploy), which
        # also suppresses the chart's own random-key Secret.
        - apiVersion: v1
          kind: Secret
          metadata:
            name: litellm-masterkey
            namespace: litellm
          type: Opaque
          stringData:
            # StackId is like arn:aws:cloudformation:...:stack/<name>/<guid>;
            # the trailing GUID is unique per stack and not in the template.
            masterkey: !Sub
              - "sk-cnf-${Guid}"
              - Guid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
        # --- LiteLLM policy callbacks (litellm_settings.callbacks) ---
        # Mounted next to config.yaml (/etc/litellm/), where LiteLLM resolves
        # callback modules; imported while config.yaml is read, so the pod does
        # not start if either fails to patch the pinned image's internals.
        #   access_policy.py — VERBATIM copy of base/scripts/litellm/access_policy.py
        #     (keep in sync, re-test on every image tag): the master key is
        #     read-only (GET statistics + UI login; model calls and writes such as
        #     /key/generate -> 403), so every model call goes through a virtual
        #     key and is attributed to it; GET /v1/models is public. Its
        #     *.svc.cluster.local URL allowance is inert here
        #     (no litellm_settings.user_url_allowed_hosts).
        #   edge_policy.py — no model call through CloudFront: any LLM route of a
        #     request stamped X-LiteLLM-Edge: cloudfront (HTTPRoute litellm-cf
        #     below) or carrying CloudFront's X-CloudFront-Secret -> 403.
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: litellm-policy
            namespace: litellm
          data:
            access_policy.py: |
              """Access policy of the base LiteLLM: a read-only master key, a public model list.

              1. The model list is public. GET /v1/models and GET /models (the OpenAI listing:
                 names only) answer without any credential, so clients and tools can discover
                 what to call before they hold a key. LiteLLM's own `general_settings.public_routes`
                 is an Enterprise feature (ignored unless premium_user), so this module extends
                 the check both auth stages call, `route_in_additonal_public_routes`, instead.
                 /v1/models/{id}, /model/info and everything else still need a key.

              2. The master key is read-only.

              Why: a request authenticated with the master key is attributed to the built-in
              `litellm_proxy_master_key` alias, not to a virtual key, so its spend is not tied
              to any key / team / budget — usage through it is invisible in the per-key
              statistics. Every model call must therefore go through a virtual key created in
              the admin UI, and the master key keeps only:

                - UI login (POST /login, /v2/login are public routes; the UI then works with
                  the short-lived session key that login mints, which this guard does not touch);
                - read-only GET/HEAD on management and statistics routes (/spend/*, /key/info,
                  /model/info, /global/*, /health, ...).

              Denied for the master key, with 403: every LLM / pass-through route (chat,
              embeddings, images, audio, responses, /bedrock/*, realtime, ...) regardless of
              method, and every non-GET management call — /key/generate, /key/regenerate,
              /key/update, /user/new, /model/new, ... — i.e. it can no longer mint keys.

              How: LiteLLM has no per-route policy for the master key, and custom_auth would
              replace its whole auth chain. Instead this module wraps the internal auth
              builder that every HTTP, WebSocket and MCP entry point funnels through, and
              checks its *result*: a master-key login is the only identity whose api_key is
              the master-key alias, whichever header carried the key.

              3. In-cluster media URLs. LiteLLM's SSRF guard refuses user-supplied URLs
                 (image_url, audio/file URLs) that resolve to a private address, which every
                 *.svc.cluster.local Service does. `litellm_settings.user_url_allowed_hosts`
                 lifts that per host, but only by exact `host` / `host:port`. This module adds
                 a suffix form: an entry `*.svc.cluster.local` allows any host ending in
                 `.svc.cluster.local` (any port). Exact entries keep LiteLLM's meaning, and a
                 matched host is still resolved and pinned to its IP — only the private-range
                 check is skipped.

              Loaded through litellm_settings.callbacks (imported while config.yaml is read,
              before the first request). Coupled to the pinned image (litellm.image.tag): the
              import fails loudly — the pod does not start — if those internals move.
              """

              import litellm
              from litellm._logging import verbose_proxy_logger
              from litellm.litellm_core_utils import url_utils as _url_utils
              from litellm.constants import LITELLM_PROXY_MASTER_KEY_ALIAS
              from litellm.integrations.custom_logger import CustomLogger
              from litellm.proxy._types import ProxyException
              from litellm.proxy.auth import user_api_key_auth as _auth
              from litellm.proxy.auth.route_checks import RouteChecks

              _READ_METHODS = frozenset({"GET", "HEAD", "OPTIONS"})
              PUBLIC_ROUTES = frozenset({"/v1/models", "/models"})


              def _deny(route: str, why: str) -> ProxyException:
                  return ProxyException(
                      message=f"master key is read-only: {why} ({route}). Use a virtual key created in the admin UI.",
                      type="auth_error",
                      param="api_key",
                      code=403,
                  )


              def _check(request, user_api_key_dict) -> None:
                  if getattr(user_api_key_dict, "api_key", None) != LITELLM_PROXY_MASTER_KEY_ALIAS:
                      return
                  route = _auth.get_request_route(request=request)
                  if RouteChecks.is_llm_api_route(route=route):
                      raise _deny(route, "model calls need a virtual key")
                  # The WebSocket path builds a synthetic scope without "method"; it only
                  # serves realtime (an LLM route, refused above), so treat it as a write.
                  method = (request.scope.get("method") or "").upper()
                  if method not in _READ_METHODS:
                      raise _deny(route, f"{method or 'non-HTTP'} is not allowed")


              _is_public = _auth.route_in_additonal_public_routes
              if not getattr(_is_public, "_access_policy", False):

                  def _public_route(current_route: str) -> bool:
                      return current_route in PUBLIC_ROUTES or _is_public(current_route=current_route)

                  _public_route._access_policy = True  # type: ignore[attr-defined]
                  _auth.route_in_additonal_public_routes = _public_route

              # v1.106.0 renamed the builder to user_api_key_auth_builder and left
              # _user_api_key_auth_builder as an alias that nothing in the module calls, so
              # wrapping only the old name silently left the master key with full access.
              # Wrap whichever is the real one and point both names at the wrapper.
              _BUILDER_NAMES = ("user_api_key_auth_builder", "_user_api_key_auth_builder")
              _builder = getattr(_auth, "user_api_key_auth_builder", None) or _auth._user_api_key_auth_builder
              if not getattr(_builder, "_access_policy", False):

                  async def _guarded_builder(*args, **kwargs):
                      result = await _builder(*args, **kwargs)
                      request = kwargs.get("request", args[0] if args else None)
                      _check(request, result)
                      return result

                  _guarded_builder._access_policy = True  # type: ignore[attr-defined]
                  for _name in _BUILDER_NAMES:
                      if hasattr(_auth, _name):
                          setattr(_auth, _name, _guarded_builder)
                  verbose_proxy_logger.warning(
                      "access_policy: master key read-only; public routes: %s", ", ".join(sorted(PUBLIC_ROUTES))
                  )


              _host_allowed = _url_utils._is_host_allowlisted
              if not getattr(_host_allowed, "_access_policy", False):

                  def _wildcard_host_allowed(hostname: str, effective_port: int) -> bool:
                      if _host_allowed(hostname, effective_port):
                          return True
                      host = hostname.lower().rstrip(".")
                      return any(
                          entry.startswith("*.") and host.endswith(entry[1:].lower().rstrip("."))
                          for entry in litellm.user_url_allowed_hosts or []
                      )

                  _wildcard_host_allowed._access_policy = True  # type: ignore[attr-defined]
                  _url_utils._is_host_allowlisted = _wildcard_host_allowed


              class MasterKeyGuard(CustomLogger):
                  """Second line of defence on the LLM call path itself."""

                  async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                      if getattr(user_api_key_dict, "api_key", None) == LITELLM_PROXY_MASTER_KEY_ALIAS:
                          raise ProxyException(
                              message="master key cannot call models. Use a virtual key created in the admin UI.",
                              type="auth_error",
                              param="api_key",
                              code=403,
                          )
                      return data


              proxy_handler_instance = MasterKeyGuard()
            edge_policy.py: |
              """Edge policy of the litellm/ stack: model calls only through Global Accelerator.

              The stack has two public entry points onto one Envoy Gateway, both private
              behind it (no public load balancer):
                - CloudFront -> VPC Origin -> internal ALB -> Envoy, HTTPRoute litellm-cf:
                  the admin UI and its SSO login;
                - Global Accelerator -> internal NLB -> Envoy, HTTPRoute litellm-ga: the API.
              Envoy stamps every request with X-LiteLLM-Edge (a `set`, so a client cannot pick
              the value): `cloudfront` on litellm-cf, `global-accelerator` on litellm-ga.
              CloudFront also adds its origin header X-CloudFront-Secret to every request,
              which a viewer cannot remove.

              A request that came through CloudFront may not call a model: every LLM,
              pass-through, MCP, agent and search route — LiteLLM's own
              RouteChecks.is_llm_api_route, the classification its key permissions use —
              answers 403 whatever the key, before authentication. The model listing
              (/v1/models, /models) stays: the UI reads it. Management routes (/key/*,
              /user/*, /spend/*, /sso/*, /ui) are not LLM routes and keep working, so the UI
              does; only its playground (it calls /chat/completions) is refused.

              Not done at Envoy with a path list: LiteLLM serves hundreds of LLM routes and
              aliases (/chat/completions, /engines/{model}/..., /openai/deployments/...,
              /bedrock/*, /anthropic/*, /mcp, ...) and adds more every release; its own
              classifier is the only list that keeps up.

              Hooks the same auth builder as access_policy.py (load it after that one), plus
              the pre-call hook as a second line on the model-call path. Coupled to the
              pinned image like access_policy.py: the import fails loudly if internals move.
              """

              from litellm._logging import verbose_proxy_logger
              from litellm.integrations.custom_logger import CustomLogger
              from litellm.proxy._types import ProxyException
              from litellm.proxy.auth import user_api_key_auth as _auth
              from litellm.proxy.auth.route_checks import RouteChecks

              EDGE_HEADER = "x-litellm-edge"
              CLOUDFRONT_HEADER = "x-cloudfront-secret"
              LISTING_ROUTES = frozenset({"/v1/models", "/models"})


              def _via_cloudfront(headers) -> bool:
                  if not headers:
                      return False
                  lower = {str(k).lower(): v for k, v in dict(headers).items()}
                  return str(lower.get(EDGE_HEADER, "")).lower() == "cloudfront" or bool(lower.get(CLOUDFRONT_HEADER))


              def _deny(route: str) -> ProxyException:
                  return ProxyException(
                      message=(
                          f"model calls are not served through CloudFront ({route}). "
                          "Call the Global Accelerator endpoint (stack output LiteLLMApiServer)."
                      ),
                      type="auth_error",
                      param="api_key",
                      code=403,
                  )


              def _check(request) -> None:
                  if request is None or not _via_cloudfront(getattr(request, "headers", None)):
                      return
                  route = _auth.get_request_route(request=request)
                  if route not in LISTING_ROUTES and RouteChecks.is_llm_api_route(route=route):
                      raise _deny(route)


              # v1.106.0 renamed the builder to user_api_key_auth_builder and kept
              # _user_api_key_auth_builder as an unused alias: wrap the real one, point both
              # names at the wrapper (as access_policy.py does, whose wrapper this wraps).
              _BUILDER_NAMES = ("user_api_key_auth_builder", "_user_api_key_auth_builder")
              _builder = getattr(_auth, "user_api_key_auth_builder", None) or _auth._user_api_key_auth_builder
              if not getattr(_builder, "_edge_policy", False):

                  async def _edge_guarded_builder(*args, **kwargs):
                      _check(kwargs.get("request", args[0] if args else None))
                      return await _builder(*args, **kwargs)

                  _edge_guarded_builder._edge_policy = True  # type: ignore[attr-defined]
                  _edge_guarded_builder._access_policy = getattr(_builder, "_access_policy", False)  # type: ignore[attr-defined]
                  for _name in _BUILDER_NAMES:
                      if hasattr(_auth, _name):
                          setattr(_auth, _name, _edge_guarded_builder)
                  verbose_proxy_logger.warning("edge_policy: no model calls through CloudFront (header %s)", EDGE_HEADER)


              class CloudFrontModelCallGuard(CustomLogger):
                  """Second line of defence on the LLM call path itself."""

                  async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                      request = (data or {}).get("proxy_server_request") or {}
                      if _via_cloudfront(request.get("headers")):
                          raise _deny(str(request.get("url") or call_type))
                      return data


              proxy_handler_instance = CloudFrontModelCallGuard()
        # --- LiteLLM HTTPRoutes: CloudFront (UI/SSO) and GA (API) ---
        # Both reach the same Service; X-LiteLLM-Edge records which edge a
        # request came through (`set` overwrites any client-supplied value) and
        # edge_policy.py refuses model calls stamped `cloudfront`. A request is
        # matched by its Host: CloudFront forwards the viewer Host (origin
        # request policy AllViewer), GA passes the TLS stream through to Envoy.
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: litellm-cf
            namespace: litellm
          spec:
            parentRefs:
              - name: eg
                namespace: envoy-gateway-system
            hostnames:
              - !GetAtt CloudFrontDistribution.DomainName
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      set:
                        - name: X-LiteLLM-Edge
                          value: cloudfront
                backendRefs:
                  - name: litellm
                    port: 4000
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: litellm-ga
            namespace: litellm
          spec:
            parentRefs:
              - name: eg
                namespace: envoy-gateway-system
            hostnames:
              - !GetAtt GlobalAccelerator.DualStackDnsName
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                filters:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      set:
                        - name: X-LiteLLM-Edge
                          value: global-accelerator
                backendRefs:
                  - name: litellm
                    port: 4000
        # --- LiteLLM UI SPA rewrite: /ui/chat -> /ui/chat.html ---
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: litellm-ui-rewrite
            namespace: litellm
          spec:
            parentRefs:
              - name: eg
                namespace: envoy-gateway-system
            hostnames:
              - !GetAtt CloudFrontDistribution.DomainName
            rules:
              - matches:
                  - path:
                      type: Exact
                      value: /ui/chat
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path:
                        type: ReplaceFullPath
                        replaceFullPath: /ui/chat.html
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      set:
                        - name: X-LiteLLM-Edge
                          value: cloudfront
                backendRefs:
                  - name: litellm
                    port: 4000
        # --- LiteLLM HPA ---
        - apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: litellm-hpa
            namespace: litellm
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: litellm
            # 3 minimum: one pod can be lost (node, AZ, rolling update, PDB
            # disruption) while two keep serving, spread over the AZs.
            minReplicas: 3
            # 30 x (2 CPU / 10Gi requested) = 60 vCPU / 300Gi, inside NodePool
            # `cpu` limits (1000 CPU / 1000Gi) and the DB connection budget
            # (database_connection_pool_limit above).
            maxReplicas: 30
            metrics:
              # CPU only. LiteLLM is an I/O-bound gateway whose memory is a fixed
              # per-worker baseline, not a function of load: a memory target reads
              # "hot" while idle and pins the HPA at maxReplicas. 60% of the 2-CPU
              # request (1.2 cores) leaves each pod headroom up to its 4-CPU limit
              # while new pods start (~1-2 min: node + image + startup).
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 60
            behavior:
              scaleUp:
                # Short window: a spike must not wait for capacity, but a single
                # 15s sample does not trigger it either.
                stabilizationWindowSeconds: 30
                policies:
                - type: Percent
                  value: 100
                  periodSeconds: 60
                - type: Pods
                  value: 4
                  periodSeconds: 60
                selectPolicy: Max
              scaleDown:
                # Scale in slowly (10 min window, one pod per 3 min): load that
                # oscillates does not flap pods, and the 660s grace period lets a
                # removed pod finish its streams.
                stabilizationWindowSeconds: 600
                policies:
                - type: Pods
                  value: 1
                  periodSeconds: 180
                selectPolicy: Min
        # --- LiteLLM BackendTrafficPolicy: 5min timeout + streaming ---
        - apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: BackendTrafficPolicy
          metadata:
            name: litellm-timeout
            namespace: litellm
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: litellm-cf
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: litellm-ga
            timeout:
              http:
                connectionIdleTimeout: 620s
                requestTimeout: 600s
            circuitBreaker:
              maxParallelRequests: 2048
              maxConnections: 200
              maxPendingRequests: 512
        # --- EnvoyGateway ClientTrafficPolicy: HTTP/2 tuning + connection limits ---
        - apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: ClientTrafficPolicy
          metadata:
            name: enable-h2
            namespace: envoy-gateway-system
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: eg
            connection:
              connectionLimit:
                value: 10000
              maxAcceptPerSocketEvent: 1
            http1:
              preserveHeaderCase: true
            http2:
              initialConnectionWindowSize: 268435456
              initialStreamWindowSize: 268435456
              maxConcurrentStreams: 1000
            timeout:
              http:
                requestReceivedTimeout: "0s"

  # LiteLLM Helm deployment (upstream litellm-helm). Values = LiteLLMDeploy's
  # LiteLLMValues (static, JSON) merged with the deploy-time endpoints, passed as
  # one values file (-f) rather than --set, so typed values (prices, lists of
  # dicts) reach config.yaml unchanged.
  HelmDeployFunction:
    Type: AWS::Lambda::Function
    DependsOn: QuotaCheck
    Properties:
      FunctionName: !Sub "${ProjectName}${EnvironmentId}-helm-deploy"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 600
      MemorySize: 512
      Role: !GetAtt KubectlLambdaRole.Arn
      Code:
        ZipFile: |
          import base64,json,logging,os,secrets,stat,subprocess,tarfile,tempfile,time,urllib3,boto3
          from botocore.signers import RequestSigner
          L=logging.getLogger();L.setLevel(logging.INFO)
          HELM_URL="https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz"
          # Master-key values that must never stay in the Secret: the historical
          # public key, and empty (it breaks the SSO UI-session JWT).
          BANNED_MASTER_KEYS={"sk-litellm-proxy-master-key",""}
          def get_token(sess,cluster,region):
            sts=sess.client("sts",region_name=region);si=sts.meta.service_model.service_id
            sg=RequestSigner(si,region,"sts","v4",sess.get_credentials(),sess.events)
            p={"method":"GET","url":f"https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15","body":{},"headers":{"x-k8s-aws-id":cluster},"context":{}}
            u=sg.generate_presigned_url(p,region_name=region,expires_in=60,operation_name="")
            return "k8s-aws-v1."+base64.urlsafe_b64encode(u.encode()).decode().rstrip("=")
          def send_cfn(event,ctx,status,data=None,reason=None,pid=None):
            body=json.dumps({"Status":status,"Reason":reason or f"Logs: {ctx.log_stream_name}","PhysicalResourceId":pid or event.get("PhysicalResourceId",ctx.log_stream_name),"StackId":event["StackId"],"RequestId":event["RequestId"],"LogicalResourceId":event["LogicalResourceId"],"Data":data or{}})
            urllib3.PoolManager().request("PUT",event["ResponseURL"],body=body.encode(),headers={"Content-Type":""})
          def install_helm():
            helm="/tmp/helm"
            if os.path.exists(helm):return helm
            r=urllib3.PoolManager().request("GET",HELM_URL)
            tgz="/tmp/helm.tar.gz"
            with open(tgz,"wb") as f:f.write(r.data)
            with tarfile.open(tgz,"r:gz") as t:
              m=t.getmember("linux-amd64/helm");m.name="helm";t.extract(m,"/tmp")
            os.chmod(helm,stat.S_IRWXU)
            return helm
          def kube(sess,cn,region):
            ci=sess.client("eks").describe_cluster(name=cn)["cluster"]
            ca=tempfile.NamedTemporaryFile(delete=False,suffix=".crt")
            ca.write(base64.b64decode(ci["certificateAuthority"]["data"]));ca.close()
            kc={"apiVersion":"v1","kind":"Config","clusters":[{"cluster":{"server":ci["endpoint"],"certificate-authority":ca.name},"name":"c"}],"contexts":[{"context":{"cluster":"c","user":"u"},"name":"x"}],"current-context":"x","users":[{"name":"u","user":{"token":get_token(sess,cn,region)}}]}
            kf=tempfile.NamedTemporaryFile(delete=False,suffix=".yaml",mode="w");json.dump(kc,kf);kf.close()
            env={**os.environ,"KUBECONFIG":kf.name,"HELM_CACHE_HOME":"/tmp/helm-cache","HELM_CONFIG_HOME":"/tmp/helm-config","HELM_DATA_HOME":"/tmp/helm-data"}
            return ci["endpoint"],ca.name,env
          def litellm_values(props,sess,region):
            # Static values (LiteLLMValues, JSON) + what is only known at deploy
            # time: SSO client + endpoints, Aurora endpoint, Valkey.
            vals=json.loads(props["LiteLLMValues"])
            pool_id=props["UserPoolId"];client_id=props["ClientId"]
            secret=sess.client("cognito-idp").describe_user_pool_client(UserPoolId=pool_id,ClientId=client_id)["UserPoolClient"].get("ClientSecret","")
            cognito=f"https://{props['CognitoDomain']}.auth.{region}.amazoncognito.com"
            env=vals.setdefault("envVars",{})
            env.update({k:str(v) for k,v in (props.get("LiteLLMEnv") or {}).items()})
            ui=env["PROXY_BASE_URL"].rstrip("/")+"/ui/"
            env.update({"GENERIC_CLIENT_ID":client_id,"GENERIC_CLIENT_SECRET":secret,
              "GENERIC_AUTHORIZATION_ENDPOINT":f"{cognito}/oauth2/authorize","GENERIC_TOKEN_ENDPOINT":f"{cognito}/oauth2/token",
              "GENERIC_USERINFO_ENDPOINT":f"{cognito}/oauth2/userInfo","PROXY_LOGOUT_URL":f"{cognito}/logout?client_id={client_id}&logout_uri={ui}"})
            vals.setdefault("db",{})["endpoint"]=props["AuroraEndpoint"]
            vh=props["ValkeyHost"];vp=int(props.get("ValkeyPort","6379"));vpw=props["ValkeyPassword"]
            pc=vals["proxy_config"]
            pc.setdefault("litellm_settings",{})["cache_params"]={"type":"redis","host":vh,"port":vp,"password":vpw,"ssl":True,"ttl":600}
            pc.setdefault("router_settings",{}).update({"redis_host":vh,"redis_port":vp,"redis_password":vpw})
            env.update({"REDIS_HOST":vh,"REDIS_PORT":str(vp),"REDIS_PASSWORD":vpw,"REDIS_SSL":"True"})
            return vals
          def rotate_weak_master_key(ep,ca,sess,cn,region,ns,release):
            # Defence in depth (non-fatal): a *masterkey* Secret holding a banned
            # value is replaced by a strong random key and the Deployment restarted.
            http=urllib3.PoolManager(cert_reqs="CERT_REQUIRED",ca_certs=ca)
            tok=get_token(sess,cn,region)
            sr=http.request("GET",f"{ep}/api/v1/namespaces/{ns}/secrets",headers={"Authorization":f"Bearer {tok}","Accept":"application/json"})
            if sr.status!=200:L.warning(f"master-key scan: secret list HTTP {sr.status}");return
            rotated=False
            for s in json.loads(sr.data.decode()).get("items",[]):
              snm=s.get("metadata",{}).get("name","")
              if "masterkey" not in snm.lower():continue
              fix={}
              for dk,dv in (s.get("data") or {}).items():
                try:val=base64.b64decode(dv).decode() if dv else ""
                except Exception:val="?"
                if val.strip() in BANNED_MASTER_KEYS:fix[dk]=base64.b64encode(f"sk-cnf-{secrets.token_urlsafe(32)}".encode()).decode()
              if not fix:L.info(f"Master key Secret '{snm}' is strong (OK)");continue
              L.warning(f"Master key Secret '{snm}' had weak value(s) {list(fix)}; rotating")
              pr=http.request("PATCH",f"{ep}/api/v1/namespaces/{ns}/secrets/{snm}",headers={"Authorization":f"Bearer {tok}","Content-Type":"application/merge-patch+json","Accept":"application/json"},body=json.dumps({"data":fix}).encode())
              L.info(f"Rotate Secret {snm}: HTTP {pr.status}");rotated=True
            if rotated:
              rp=json.dumps({"spec":{"template":{"metadata":{"annotations":{"cnf.masterkey/rotatedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}}}}}).encode()
              rr=http.request("PATCH",f"{ep}/apis/apps/v1/namespaces/{ns}/deployments/{release}",headers={"Authorization":f"Bearer {tok}","Content-Type":"application/strategic-merge-patch+json","Accept":"application/json"},body=rp)
              L.info(f"Restart deployment {release}: HTTP {rr.status}")
          def handler(event,ctx):
            ev=dict(event);ev["ResourceProperties"]={k:("<redacted>" if "Password" in k else v) for k,v in event["ResourceProperties"].items()}
            L.info(json.dumps(ev,default=str))
            rt=event["RequestType"];props=event["ResourceProperties"]
            cn=props["ClusterName"];ns=props["Namespace"];release=props["ReleaseName"]
            region=props.get("Region",boto3.session.Session().region_name)
            sess=boto3.Session(region_name=region)
            if rt=="Delete":
              try:
                ep,ca,env=kube(sess,cn,region)
                r=subprocess.run([install_helm(),"uninstall",release,"-n",ns,"--ignore-not-found"],capture_output=True,text=True,env=env)
                L.info(f"Uninstall: {r.stdout} {r.stderr}")
              except Exception as e:
                L.warning(f"Delete cleanup: {e}")
              send_cfn(event,ctx,"SUCCESS",pid="helm-deploy");return
            try:
              helm=install_helm()
              ep,ca,env=kube(sess,cn,region)
              vf=tempfile.NamedTemporaryFile(delete=False,suffix=".json",mode="w")
              json.dump(litellm_values(props,sess,region),vf);vf.close()
              # No --wait: the first start (image pull, Prisma migrations) can
              # outlast this Lambda; NlbHealthCheck runs after it.
              cmd=[helm,"upgrade","--install",release,props["ChartRef"],"--version",props["ChartVersion"],"--namespace",ns,"--create-namespace","-f",vf.name]
              L.info(f"Running: {' '.join(cmd[:8])} -f <values>")
              r=subprocess.run(cmd,capture_output=True,text=True,env=env,timeout=540)
              L.info(f"stdout: {r.stdout}")
              if r.returncode!=0:
                L.error(f"stderr: {r.stderr}")
                send_cfn(event,ctx,"FAILED",reason=r.stderr[:256]);return
              try:rotate_weak_master_key(ep,ca,sess,cn,region,ns,release)
              except Exception as mke:L.warning(f"Master key safety-net (non-fatal): {mke}")
              send_cfn(event,ctx,"SUCCESS",data={"Release":release,"Namespace":ns},pid="helm-deploy")
            except Exception as e:
              L.exception("fail");send_cfn(event,ctx,"FAILED",reason=str(e)[:256])

  # --- LiteLLM Helm Deployment ---
  LiteLLMDeploy:
    Type: Custom::HelmDeploy
    DependsOn:
      - K8sAppResources
      - GAHttpsSetup
      - LiteLLMCognitoClient
      - LiteLLMManagedLoginBranding
      - ValkeyCache
    Properties:
      ServiceToken: !GetAtt HelmDeployFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      Namespace: litellm
      ReleaseName: litellm
      ChartRef: "oci://docker.litellm.ai/berriai/litellm-helm"
      # The policy callbacks (K8sAppResources: litellm-policy) patch internals of
      # this exact version: bump chart, image.tag and re-run the checks of
      # API.md §7 together.
      ChartVersion: "1.106.6"
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref LiteLLMCognitoClient
      CognitoDomain: !Ref CognitoUserPoolDomain
      AuroraEndpoint: !GetAtt AuroraCluster.Endpoint.Address
      ValkeyHost: !GetAtt ValkeyCache.Endpoint.Address
      ValkeyPort: !GetAtt ValkeyCache.Endpoint.Port
      ValkeyPassword: !Sub "${ProjectName}${EnvironmentId}Valkey2026!"
      LiteLLMEnv:
        SERVER_ROOT_PATH: ""
        # The UI and the SSO callback live on CloudFront; the API on GA.
        PROXY_BASE_URL: !Sub "https://${CloudFrontDistribution.DomainName}"
        GENERIC_CLIENT_STATE: "litellm-sso"
        AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
        GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: "groups"
        GENERIC_ROLE_MAPPINGS_ROLES: "{'proxy_admin': ['admin']}"
      # Static Helm values. Notes, by key:
      #   image: v1.106.6, the tag base/ runs (base/values.yaml litellm.image.tag).
      #   masterkeySecretName: the per-stack key of K8sAppResources; read-only
      #     through access_policy.py. disable_env_credential_login: it cannot be
      #     used as the UI password either — the UI is entered through Cognito SSO.
      #   callbacks: access_policy (read-only master key) then edge_policy (no
      #     model calls through CloudFront); order matters, both wrap one function.
      #   store_model_in_db false: model_list below is the whole catalogue; the UI
      #     cannot add models.
      #   store_prompts_in_spend_logs false: as base/ — no prompt or response
      #     text in the database.
      #   key_generation_settings: every team / personal key needs a budget.
      #   model_list: the Bedrock models litellm-model-discovery selects
      #     (docker/litellm-model-discovery/configs/config.yaml rules: Claude >= 5.5
      #     via InvokeModel, GPT >= 6 via bedrock-mantle Responses API, GLM >= 5.3,
      #     Kimi >= 3 without prompt caching, Cohere embed >= 4), with the same
      #     names, backends, prices and capabilities as it writes into base/
      #     (read from base's /model/info on 2026-10-29). No bedrock/* wildcard.
      #   Sizing (per pod, num_workers 4): requests 2 CPU / 10Gi, limits 4 CPU /
      #     10Gi. Memory request == limit: the node never over-commits memory, so
      #     a busy neighbour cannot get this pod OOM-killed or evicted; 4 workers
      #     idle near 3.7Gi, leaving ~6Gi for long-context / streaming bursts. One
      #     pod fits an m8g.xlarge (4 vCPU / 16GiB) of NodePool `cpu`. CPU limit
      #     2x the request: bursts use spare cores, the HPA sees real load.
      #   Stability: probes with 10s timeouts (a saturated worker must not be
      #     restarted by its liveness probe); preStop sleep 20s so Envoy drops the
      #     endpoint before the pod stops accepting; terminationGracePeriod 660s
      #     = the 600s request timeout + drain, so a scale-in never cuts a long
      #     stream; PDB maxUnavailable 1 against node consolidation / upgrades;
      #     maxSurge 25% (rolling update never below current capacity).
      #   database_connection_pool_limit 10 is per worker: 4 x 10 x maxReplicas
      #     30 = 1200 connections, within Aurora's max_connections at MaxCapacity 8.
      #   HPA: K8sAppResources (litellm-hpa, CPU only), not the chart's.
      LiteLLMValues: !Sub
        - |
          {
            "image": {"repository": "ghcr.io/berriai/litellm", "tag": "v1.106.6", "pullPolicy": "IfNotPresent"},
            "masterkeySecretName": "litellm-masterkey",
            "masterkeySecretKey": "masterkey",
            "serviceAccount": {"create": false, "name": "litellm-sa"},
            "service": {"type": "ClusterIP", "port": 4000},
            "db": {"useExisting": true, "deployStandalone": false, "database": "litellm",
                   "url": "postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)",
                   "secret": {"name": "postgres-creds", "usernameKey": "username", "passwordKey": "password"}},
            "migrationJob": {"enabled": true},
            "redis": {"enabled": false},
            "ingress": {"enabled": false},
            "nodeSelector": {"kubernetes.io/arch": "arm64"},
            "args": ["--config", "/etc/litellm/config.yaml", "--host", "::", "--num_workers", "4"],
            "startupProbe": {"path": "/health/readiness", "initialDelaySeconds": 30, "periodSeconds": 10, "timeoutSeconds": 10, "failureThreshold": 60},
            "livenessProbe": {"path": "/health/liveliness", "periodSeconds": 15, "timeoutSeconds": 10, "failureThreshold": 6},
            "readinessProbe": {"path": "/health/readiness", "periodSeconds": 10, "timeoutSeconds": 10, "failureThreshold": 3},
            "strategy": {"type": "RollingUpdate", "rollingUpdate": {"maxUnavailable": 0, "maxSurge": "25%"}},
            "resources": {"requests": {"cpu": "2000m", "memory": "10Gi"}, "limits": {"cpu": "4000m", "memory": "10Gi"}},
            "terminationGracePeriodSeconds": 660,
            "lifecycle": {"preStop": {"exec": {"command": ["/usr/bin/sleep", "20"]}}},
            "pdb": {"enabled": true, "maxUnavailable": 1},
            "topologySpreadConstraints": [
              {"maxSkew": 1, "topologyKey": "topology.kubernetes.io/zone", "whenUnsatisfiable": "DoNotSchedule",
               "labelSelector": {"matchLabels": {"app.kubernetes.io/name": "litellm"}}},
              {"maxSkew": 2, "topologyKey": "kubernetes.io/hostname", "whenUnsatisfiable": "ScheduleAnyway",
               "labelSelector": {"matchLabels": {"app.kubernetes.io/name": "litellm"}}}
            ],
            "volumes": [{"name": "litellm-policy", "configMap": {"name": "litellm-policy"}}],
            "volumeMounts": [
              {"name": "litellm-policy", "mountPath": "/etc/litellm/access_policy.py", "subPath": "access_policy.py", "readOnly": true},
              {"name": "litellm-policy", "mountPath": "/etc/litellm/edge_policy.py", "subPath": "edge_policy.py", "readOnly": true}
            ],
            "envVars": {"LITELLM_MODE": "PRODUCTION", "LITELLM_LOG": "ERROR", "LITELLM_TELEMETRY": "False"},
            "proxy_config": {
              "general_settings": {
                "master_key": "os.environ/PROXY_MASTER_KEY",
                "disable_env_credential_login": true,
                "store_model_in_db": false,
                "allow_requests_on_db_unavailable": true,
                "database_connection_pool_limit": 10,
                "maximum_spend_logs_retention_period": "7d",
                "store_prompts_in_spend_logs": false,
                "disable_error_logs": true,
                "forward_client_headers_to_llm_api": false,
                "proxy_batch_write_at": 30,
                "max_parallel_requests": 100,
                "global_max_parallel_requests": 500
              },
              "litellm_settings": {
                "callbacks": ["access_policy.proxy_handler_instance", "edge_policy.proxy_handler_instance"],
                "drop_params": true,
                "set_verbose": false,
                "json_logs": true,
                "request_timeout": 600,
                "cache": true,
                "key_generation_settings": {
                  "team_key_generation": {"required_params": ["max_budget", "budget_duration"]},
                  "personal_key_generation": {"required_params": ["max_budget", "budget_duration"]}
                }
              },
