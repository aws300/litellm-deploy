  # --- CloudFront VPC Origin ---
  # The gateway LBs are internal (no public IP), so CloudFront cannot reach them
  # over the public internet. A VPC Origin establishes a CloudFront-managed
  # PrivateLink connection into the VPC so the distribution can route to the LB
  # ARN directly. We point it at the dualstack internal ALB (AWS rejects a
  # dualstack NLB as a VPC origin, so the ALB is used for CloudFront while the
  # NLB is used for Global Accelerator).
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html
  CloudFrontVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: AlbLookup
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub "${ProjectName}${EnvironmentId}-alb-origin"
        Arn: !GetAtt AlbLookup.AlbArn
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols:
          - TLSv1.2

  # --- CloudFront managed SG ingress to AlbSecurityGroup ---
  # When AWS creates the first VPC Origin in an account it auto-creates a
  # service-managed security group (CloudFront-VPCOrigins-Service-SG) in the VPC.
  # VPC CIDR ingress alone is NOT sufficient for CloudFront's traffic (AWS
  # internal routing bypasses IP-based SG checks); the only reliable way is an
  # SG-to-SG ingress rule. This Lambda finds that SG by tag and authorizes it.
  CloudFrontSgIngressFunction:
    Type: AWS::Lambda::Function
    DependsOn: QuotaCheck
    Properties:
      FunctionName: !Sub "${ProjectName}${EnvironmentId}-cf-sg-ingress"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 600
      MemorySize: 256
      Role: !GetAtt KubectlLambdaRole.Arn
      Code:
        ZipFile: |
          import json,logging,time,boto3,urllib3
          L=logging.getLogger();L.setLevel(logging.INFO)
          def send_cfn(event,ctx,status,reason=None,pid=None,data=None):
            body=json.dumps({"Status":status,"Reason":reason or f"Logs: {ctx.log_stream_name}","PhysicalResourceId":pid or event.get("PhysicalResourceId",ctx.log_stream_name),"StackId":event["StackId"],"RequestId":event["RequestId"],"LogicalResourceId":event["LogicalResourceId"],"Data":data or {}})
            urllib3.PoolManager().request("PUT",event["ResponseURL"],body=body.encode(),headers={"Content-Type":""})
          def handler(event,ctx):
            L.info(json.dumps(event,default=str))
            rt=event["RequestType"];props=event["ResourceProperties"]
            region=props.get("Region",boto3.session.Session().region_name)
            ec2=boto3.client("ec2",region_name=region)
            alb_sg=props["AlbSecurityGroupId"];vpc_id=props["VpcId"]
            port=int(props.get("Port","80"))
            try:
              cf_sg=None
              # Wait up to 10 min for CloudFront to auto-create the SG
              for att in range(60):
                if ctx.get_remaining_time_in_millis()<60000:break
                resp=ec2.describe_security_groups(Filters=[
                  {"Name":"vpc-id","Values":[vpc_id]},
                  {"Name":"tag:aws.cloudfront.vpcorigin","Values":["enabled"]}])
                if resp["SecurityGroups"]:
                  cf_sg=resp["SecurityGroups"][0]["GroupId"]
                  L.info(f"Found CloudFront managed SG: {cf_sg} (attempt {att+1})")
                  break
                L.info(f"Waiting for CloudFront-VPCOrigins-Service-SG (attempt {att+1})")
                time.sleep(10)
              if rt=="Delete":
                if cf_sg:
                  try:
                    ec2.revoke_security_group_ingress(GroupId=alb_sg,IpPermissions=[{"IpProtocol":"tcp","FromPort":port,"ToPort":port,"UserIdGroupPairs":[{"GroupId":cf_sg}]}])
                    L.info(f"Revoked ingress from {cf_sg}")
                  except Exception as e:
                    L.warning(f"Revoke (non-fatal): {e}")
                send_cfn(event,ctx,"SUCCESS",pid=event.get("PhysicalResourceId","cf-sg-ingress"))
                return
              if not cf_sg:
                send_cfn(event,ctx,"FAILED",reason="CloudFront managed SG not found within timeout")
                return
              try:
                ec2.authorize_security_group_ingress(GroupId=alb_sg,IpPermissions=[{"IpProtocol":"tcp","FromPort":port,"ToPort":port,"UserIdGroupPairs":[{"GroupId":cf_sg,"Description":"CloudFront VPC Origin managed SG"}]}])
                L.info(f"Ingress added to {alb_sg} from {cf_sg}")
              except Exception as e:
                if "InvalidPermission.Duplicate" in str(e):
                  L.info("Rule already exists - OK")
                else:
                  raise
              send_cfn(event,ctx,"SUCCESS",data={"CloudFrontSgId":cf_sg},pid=f"cf-sg-ingress-{alb_sg}")
            except Exception as e:
              L.exception("fail");send_cfn(event,ctx,"FAILED",reason=str(e)[:256])

  CloudFrontSgIngress:
    Type: Custom::CloudFrontSgIngress
    DependsOn: CloudFrontVpcOrigin
    Properties:
      ServiceToken: !GetAtt CloudFrontSgIngressFunction.Arn
      AlbSecurityGroupId: !Ref AlbSecurityGroup
      VpcId: !Ref VPC
      Port: 80
      Region: !Ref "AWS::Region"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: CloudFrontSgIngress
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}${EnvironmentId} - HTTP via EnvoyGateway"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: EnvoyGatewayNLB
            DomainName: !GetAtt AlbLookup.AlbDns
            VpcOriginConfig:
              VpcOriginId: !GetAtt CloudFrontVpcOrigin.Id
              OriginKeepaliveTimeout: 60
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-CloudFront-Secret
                HeaderValue: !Sub "cnf-${EnvironmentId}-${AWS::AccountId}"
        DefaultCacheBehavior:
          TargetOriginId: EnvoyGatewayNLB
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
          OriginRequestPolicyId: "216adef6-5c7f-47e4-b989-5492eafa07d3"
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          Compress: true
        CacheBehaviors:
          - PathPattern: "/assets/*"
            TargetOriginId: EnvoyGatewayNLB
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref CachePolicyStaticAssets
            OriginRequestPolicyId: "bf0718e1-ba1e-49d1-88b1-f726733018ae"
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            Compress: true
          - PathPattern: "/ui"
            TargetOriginId: EnvoyGatewayNLB
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref CachePolicyHtml
            OriginRequestPolicyId: "216adef6-5c7f-47e4-b989-5492eafa07d3"
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            Compress: true
          - PathPattern: "/ui/*"
            TargetOriginId: EnvoyGatewayNLB
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref CachePolicyHtml
            OriginRequestPolicyId: "216adef6-5c7f-47e4-b989-5492eafa07d3"
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            Compress: true
          - PathPattern: "/auth/*"
            TargetOriginId: EnvoyGatewayNLB
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "216adef6-5c7f-47e4-b989-5492eafa07d3"
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            Compress: true
          - PathPattern: "/sso/*"
            TargetOriginId: EnvoyGatewayNLB
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "216adef6-5c7f-47e4-b989-5492eafa07d3"
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            Compress: true
          - PathPattern: "/auth/oidc/*"
            TargetOriginId: EnvoyGatewayNLB
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "216adef6-5c7f-47e4-b989-5492eafa07d3"
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            Compress: true
        CustomErrorResponses:
          - ErrorCode: 502
            ErrorCachingMinTTL: 1
          - ErrorCode: 503
            ErrorCachingMinTTL: 1
          - ErrorCode: 504
            ErrorCachingMinTTL: 1
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}${EnvironmentId}-cf"

  # ============================================================================
  # SECTION 9: GLOBAL ACCELERATOR
  # ============================================================================

  GlobalAccelerator:
    Type: AWS::GlobalAccelerator::Accelerator
    DependsOn: QuotaCheck
    Properties:
      Name: !Sub "${ProjectName}${EnvironmentId}"
      IpAddressType: DUAL_STACK
      Enabled: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}${EnvironmentId}-ga"

  GAListener443:
    Type: AWS::GlobalAccelerator::Listener
    Properties:
      AcceleratorArn: !Ref GlobalAccelerator
      Protocol: TCP
      PortRanges:
        - FromPort: 443
          ToPort: 443

  GAEndpointGroup443:
    Type: AWS::GlobalAccelerator::EndpointGroup
    Properties:
      ListenerArn: !Ref GAListener443
      EndpointGroupRegion: !Ref "AWS::Region"
      EndpointConfigurations:
        - EndpointId: !GetAtt NlbLookup.NlbArn
          ClientIPPreservationEnabled: true
          Weight: 100

  GAListener80:
    Type: AWS::GlobalAccelerator::Listener
    Properties:
      AcceleratorArn: !Ref GlobalAccelerator
      Protocol: TCP
      PortRanges:
        - FromPort: 80
          ToPort: 80

  GAEndpointGroup80:
    Type: AWS::GlobalAccelerator::EndpointGroup
    Properties:
      ListenerArn: !Ref GAListener80
      EndpointGroupRegion: !Ref "AWS::Region"
      EndpointConfigurations:
        - EndpointId: !GetAtt NlbLookup.NlbArn
          ClientIPPreservationEnabled: true
          Weight: 100

  # ============================================================================
  # SECTION 10: KUBERNETES APP RESOURCES (Test Pod + Routes + OIDC Policy)
  # ============================================================================

  EfsCsiPodIdentityAssoc:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: AddonEfsCsi
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      ServiceAccount: efs-csi-controller-sa
      RoleArn: !GetAtt EfsCsiRole.Arn

  LiteLLMPodIdentityAssoc:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: AddonEfsCsi
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: litellm
      ServiceAccount: litellm-sa
      RoleArn: !GetAtt PodRole.Arn

  # Placeholder - maintains dependency chain for GAHttpsSetup
  K8sAppResources:
    Type: Custom::K8sApp
    DependsOn:
      - K8sInfraResources
      - NlbLookup
      - AuroraInstance
    Properties:
      ServiceToken: !GetAtt KubectlFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      Manifests:
        # --- LiteLLM Namespace ---
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: litellm
        # --- LiteLLM ServiceAccount (IRSA via Pod Identity) ---
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: litellm-sa
            namespace: litellm
        # --- LiteLLM PostgreSQL credentials Secret ---
        - apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-creds
            namespace: litellm
          type: Opaque
          stringData:
            username: pgadmin
            password: !Sub "${ProjectName}${EnvironmentId}Pg2026!"
        # --- LiteLLM master-key Secret (strong, unguessable, per-stack) ---
        # A master key is REQUIRED: LiteLLM signs the SSO UI-session JWT with it
        # (HS256), and an empty key makes SSO login impossible (PyJWT rejects an
        # empty HMAC key). The original security risk was a *hardcoded, public*
        # key (sk-litellm-proxy-master-key) — anyone could use it. We instead
        # derive a strong random key from the CloudFormation StackId GUID (unique
        # per deployment, not in source), and — critically — restrict what the
        # master key may DO via the custom_auth hook below: it becomes read-only
        # (usage/stats), and CANNOT call models or create/modify keys. Those
        # operations require an SSO-issued admin virtual key. We point the chart
        # at this Secret via masterkeySecretName (see LiteLLMDeploy HelmSets),
        # which also suppresses the chart's own random-key Secret.
        - apiVersion: v1
          kind: Secret
          metadata:
            name: litellm-masterkey
            namespace: litellm
          type: Opaque
          stringData:
            # StackId is like arn:aws:cloudformation:...:stack/<name>/<guid>;
            # the trailing GUID is unique per stack and not in the template.
            masterkey: !Sub
              - "sk-cnf-${Guid}"
              - Guid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
        # --- LiteLLM custom_auth module (master key = read-only) ---
        # Mounted into the proxy at /etc/litellm/ (LiteLLM resolves custom_auth
        # module paths relative to the config file dir). In auto mode the
        # enterprise custom-auth wrapper falls back to LiteLLM's built-in auth
        # whenever this hook raises a non-ProxyException, so we only OWN the
        # master-key deny decision and defer everything else unchanged.
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: litellm-custom-auth
            namespace: litellm
          data:
            litellm_master_key_readonly.py: |
              """custom_auth: make the LiteLLM master key read-only.

              The master key must exist (it signs the SSO UI-session JWT) but must
              NOT be usable to call models or create/modify/delete API keys. It
              keeps read & statistics access. Any other credential (SSO admin
              virtual key, normal virtual key, JWT) defers to built-in auth.
              """
              import os
              from fastapi import Request
              from litellm.proxy._types import LiteLLMRoutes, ProxyException
              from litellm.proxy.auth.auth_utils import get_request_route


              class _Fallback(Exception):
                  """Hand control back to LiteLLM's built-in auth (auto mode)."""


              _MASTER_KEY_ALLOWED = set(LiteLLMRoutes.info_routes.value) | {
                  "/spend/logs", "/spend/logs/v2", "/spend/calculate", "/spend/tags",
                  "/global/spend", "/global/spend/logs", "/global/spend/report",
                  "/global/spend/tags", "/global/spend/keys", "/global/spend/models",
                  "/global/spend/provider", "/global/spend/end_users",
                  "/global/activity", "/global/activity/model",
                  "/global/activity/exceptions",
                  "/key/info", "/key/health", "/key/list",
                  "/user/info", "/v2/user/info", "/user/list",
                  "/team/info", "/team/list", "/team/available",
                  "/model/info", "/v1/model/info", "/models", "/v1/models",
                  "/model_group/info", "/active/callbacks", "/settings",
                  "/health", "/health/liveliness", "/health/liveness",
                  "/health/readiness", "/health/services",
              }


              async def user_api_key_auth(request: Request, api_key: str):
                  master_key = os.environ.get("PROXY_MASTER_KEY", "") or ""
                  presented = (api_key or "").replace("Bearer ", "").strip()
                  if master_key and presented == master_key:
                      route = get_request_route(request=request)
                      if route not in _MASTER_KEY_ALLOWED:
                          raise ProxyException(
                              message=(
                                  "master key is read-only: it can only read "
                                  "usage/statistics. It cannot call models or "
                                  "create/modify keys. Use an SSO-issued admin "
                                  "virtual key for those operations."
                              ),
                              type="auth_error",
                              param="api_key",
                              code=403,
                          )
                  raise _Fallback()
        # --- LiteLLM HTTPRoute (CloudFront) ---
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: litellm-cf
            namespace: litellm
          spec:
            parentRefs:
              - name: eg
                namespace: envoy-gateway-system
            hostnames:
              - !GetAtt CloudFrontDistribution.DomainName
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: litellm
                    port: 4000
        # --- LiteLLM HTTPRoute (GA) ---
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: litellm-ga
            namespace: litellm
          spec:
            parentRefs:
              - name: eg
                namespace: envoy-gateway-system
            hostnames:
              - !GetAtt GlobalAccelerator.DualStackDnsName
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: litellm
                    port: 4000
        # --- LiteLLM UI SPA rewrite: /ui/chat -> /ui/chat.html ---
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: litellm-ui-rewrite
            namespace: litellm
          spec:
            parentRefs:
              - name: eg
                namespace: envoy-gateway-system
            hostnames:
              - !GetAtt CloudFrontDistribution.DomainName
            rules:
              - matches:
                  - path:
                      type: Exact
                      value: /ui/chat
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path:
                        type: ReplaceFullPath
                        replaceFullPath: /ui/chat.html
                backendRefs:
                  - name: litellm
                    port: 4000
        # --- LiteLLM HPA ---
        - apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: litellm-hpa
            namespace: litellm
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: litellm
            # Production: 2 replicas minimum for HA (survive a node/AZ loss and
            # rolling restarts without dropping to zero capacity).
            minReplicas: 2
            # Cap scale-out to a sane bound. At ~5Gi request/pod, 20 pods is
            # ~100Gi + 20 vCPU of requests — enough for large bursts while
            # preventing a runaway fan-out (and runaway Karpenter/cost).
            maxReplicas: 20
            metrics:
              # Scale on CPU utilization ONLY. LiteLLM is an I/O-bound gateway:
              # its memory is a fixed per-worker baseline (~3.7Gi at idle for
              # num_workers=4), NOT a function of load — so a memory metric is a
              # broken scaling signal (it reads "hot" even while idle and never
              # converges). CPU tracks real request pressure.
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 70
            behavior:
              scaleUp:
                # React fast to load spikes, but not on transient blips.
                stabilizationWindowSeconds: 60
                policies:
                # Allow either +100% or +4 pods per minute, whichever is greater.
                - type: Percent
                  value: 100
                  periodSeconds: 60
                - type: Pods
                  value: 4
                  periodSeconds: 60
                selectPolicy: Max
              scaleDown:
                # Scale in conservatively (5min window) so long-lived streaming
                # requests aren't disrupted by premature pod removal.
                stabilizationWindowSeconds: 300
                policies:
                - type: Pods
                  value: 1
                  periodSeconds: 120
        # --- LiteLLM BackendTrafficPolicy: 5min timeout + streaming ---
        - apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: BackendTrafficPolicy
          metadata:
            name: litellm-timeout
            namespace: litellm
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: litellm-cf
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: litellm-ga
            timeout:
              http:
                connectionIdleTimeout: 620s
                requestTimeout: 600s
            circuitBreaker:
              maxParallelRequests: 2048
              maxConnections: 200
              maxPendingRequests: 512
        # --- EnvoyGateway ClientTrafficPolicy: HTTP/2 tuning + connection limits ---
        - apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: ClientTrafficPolicy
          metadata:
            name: enable-h2
            namespace: envoy-gateway-system
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: eg
            connection:
              connectionLimit:
                value: 10000
              maxAcceptPerSocketEvent: 1
            http1:
              preserveHeaderCase: true
            http2:
              initialConnectionWindowSize: 268435456
              initialStreamWindowSize: 268435456
              maxConcurrentStreams: 1000
            timeout:
              http:
                requestReceivedTimeout: "0s"

  # Helm-based app deployment
  HelmDeployFunction:
    Type: AWS::Lambda::Function
    DependsOn: QuotaCheck
    Properties:
      FunctionName: !Sub "${ProjectName}${EnvironmentId}-helm-deploy"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 600
      MemorySize: 512
      Role: !GetAtt KubectlLambdaRole.Arn
      Code:
        ZipFile: |
          import base64,json,logging,os,stat,subprocess,tempfile,time,urllib3,boto3
          from botocore.signers import RequestSigner
          L=logging.getLogger();L.setLevel(logging.INFO)
          HELM_URL="https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz"
          def get_token(sess,cluster,region):
            sts=sess.client("sts",region_name=region);si=sts.meta.service_model.service_id
            sg=RequestSigner(si,region,"sts","v4",sess.get_credentials(),sess.events)
            p={"method":"GET","url":f"https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15","body":{},"headers":{"x-k8s-aws-id":cluster},"context":{}}
            u=sg.generate_presigned_url(p,region_name=region,expires_in=60,operation_name="")
            return "k8s-aws-v1."+base64.urlsafe_b64encode(u.encode()).decode().rstrip("=")
          def send_cfn(event,ctx,status,data=None,reason=None,pid=None):
            body=json.dumps({"Status":status,"Reason":reason or f"Logs: {ctx.log_stream_name}","PhysicalResourceId":pid or event.get("PhysicalResourceId",ctx.log_stream_name),"StackId":event["StackId"],"RequestId":event["RequestId"],"LogicalResourceId":event["LogicalResourceId"],"Data":data or{}})
            urllib3.PoolManager().request("PUT",event["ResponseURL"],body=body.encode(),headers={"Content-Type":""})
          def install_helm():
            helm="/tmp/helm"
            if os.path.exists(helm):return helm
            http=urllib3.PoolManager()
            r=http.request("GET",HELM_URL)
            tgz="/tmp/helm.tar.gz"
            with open(tgz,"wb") as f:f.write(r.data)
            import tarfile
            with tarfile.open(tgz,"r:gz") as t:
              m=t.getmember("linux-amd64/helm")
              m.name="helm"
              t.extract(m,"/tmp")
            os.chmod(helm,stat.S_IRWXU)
            return helm
          def handler(event,ctx):
            L.info(json.dumps(event,default=str))
            rt=event["RequestType"];props=event["ResourceProperties"]
            if rt=="Delete":
              try:
                helm=install_helm()
                cn=props["ClusterName"];ns=props["Namespace"]
                region=props.get("Region",boto3.session.Session().region_name)
                sess=boto3.Session(region_name=region)
                eks=sess.client("eks");ci=eks.describe_cluster(name=cn)["cluster"]
                ep=ci["endpoint"];ca_data=ci["certificateAuthority"]["data"]
                ca_file=tempfile.NamedTemporaryFile(delete=False,suffix=".crt")
                ca_file.write(base64.b64decode(ca_data));ca_file.flush();ca_file.close()
                token=get_token(sess,cn,region)
                kc={"apiVersion":"v1","kind":"Config","clusters":[{"cluster":{"server":ep,"certificate-authority":ca_file.name},"name":"c"}],"contexts":[{"context":{"cluster":"c","user":"u"},"name":"x"}],"current-context":"x","users":[{"name":"u","user":{"token":token}}]}
                kf=tempfile.NamedTemporaryFile(delete=False,suffix=".yaml",mode="w")
                json.dump(kc,kf);kf.flush();kf.close()
                env={**os.environ,"KUBECONFIG":kf.name}
                r=subprocess.run([helm,"uninstall",props.get("ReleaseName","cnf"),"-n",ns,"--ignore-not-found"],capture_output=True,text=True,env=env)
                L.info(f"Uninstall: {r.stdout} {r.stderr}")
              except Exception as e:
                L.warning(f"Delete cleanup: {e}")
              send_cfn(event,ctx,"SUCCESS",pid="helm-deploy");return
            try:
              cn=props["ClusterName"];ns=props["Namespace"]
              region=props.get("Region",boto3.session.Session().region_name)
              sess=boto3.Session(region_name=region)
              # Get client secret
              pool_id=props.get("UserPoolId","");client_id=props.get("ClientId","")
              secret=""
              if pool_id and client_id:
                cog=sess.client("cognito-idp")
                resp=cog.describe_user_pool_client(UserPoolId=pool_id,ClientId=client_id)
                secret=resp["UserPoolClient"].get("ClientSecret","")
              # Setup kubeconfig
              helm=install_helm()
              eks=sess.client("eks");ci=eks.describe_cluster(name=cn)["cluster"]
              ep=ci["endpoint"];ca_data=ci["certificateAuthority"]["data"]
              ca_file=tempfile.NamedTemporaryFile(delete=False,suffix=".crt")
              ca_file.write(base64.b64decode(ca_data));ca_file.flush();ca_file.close()
              token=get_token(sess,cn,region)
              kc={"apiVersion":"v1","kind":"Config","clusters":[{"cluster":{"server":ep,"certificate-authority":ca_file.name},"name":"c"}],"contexts":[{"context":{"cluster":"c","user":"u"},"name":"x"}],"current-context":"x","users":[{"name":"u","user":{"token":token}}]}
              kf=tempfile.NamedTemporaryFile(delete=False,suffix=".yaml",mode="w")
              json.dump(kc,kf);kf.flush();kf.close()
              env={**os.environ,"KUBECONFIG":kf.name,"HELM_CACHE_HOME":"/tmp/helm-cache","HELM_CONFIG_HOME":"/tmp/helm-config","HELM_DATA_HOME":"/tmp/helm-data"}
              # Build helm command
              release=props.get("ReleaseName","cnf")
              chart=props.get("ChartRef","oci://public.ecr.aws/b1y9i2f3/cnf")
              version=props.get("ChartVersion","0.1.0")
              wait_install=not props.get("LiteLLMConfig")
              cmd=[helm,"upgrade","--install",release,chart,"--version",version,"--namespace",ns,"--create-namespace"]
              if wait_install:cmd+=["--wait","--timeout","10m"]
              sets=props.get("HelmSets",{})
              for k,v in sets.items():
                cmd+=["--set",f"{k}={v}"]
              # GA all IPs as Helm array
              ga_ips_key=props.get("GAIpsKey")
              if ga_ips_key:
                ips=[f"{ip}/32" for ip in props.get("GAIpv4s",[])]+[f"{ip}/128" for ip in props.get("GAIpv6s",[])]
                cmd+=["--set",f"{ga_ips_key}={{{','.join(ips)}}}"]
              # Add auth URI if cognito configured
              if pool_id and client_id and secret:
                issuer_host=f"cognito-idp.{region}.amazonaws.com/{pool_id}"
                auth_uri=f"oidc://{client_id}:{secret}@{issuer_host}?scope=openid%20profile%20email&oidc_logout=false"
                cmd+=["--set",f"scaffolding.config.auth={auth_uri}"]
              # LiteLLM-specific config
              if props.get("LiteLLMConfig"):
                domain=f"cnf-{props.get('EnvironmentId','001')}-{boto3.client('sts').get_caller_identity()['Account']}"
                cognito_base=f"https://{domain}.auth.{region}.amazoncognito.com"
                litellm_env=props.get("LiteLLMEnv",{})
                # DB endpoint from Aurora
                db_ep=props.get("AuroraEndpoint","")
                if db_ep:
                  cmd+=["--set",f"db.endpoint={db_ep}"]
                  cmd+=["--set","db.database=litellm"]
                  cmd+=["--set","db.url=postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)"]
                # Cognito SSO env vars
                cmd+=["--set",f"envVars.GENERIC_CLIENT_ID={client_id}"]
                cmd+=["--set",f"envVars.GENERIC_CLIENT_SECRET={secret}"]
                cmd+=["--set",f"envVars.GENERIC_AUTHORIZATION_ENDPOINT={cognito_base}/oauth2/authorize"]
                cmd+=["--set",f"envVars.GENERIC_TOKEN_ENDPOINT={cognito_base}/oauth2/token"]
                cmd+=["--set",f"envVars.GENERIC_USERINFO_ENDPOINT={cognito_base}/oauth2/userInfo"]
                # Logout URL (use CloudFront host for UI redirect)
                cf_host=litellm_env.get("CLOUDFRONT_HOST","")
                ui_url=f"https://{cf_host}/ui/" if cf_host else ""
                cmd+=["--set",f"envVars.PROXY_LOGOUT_URL={cognito_base}/logout?client_id={client_id}&logout_uri={ui_url}"]
                # All other LiteLLM env vars
                for ek,ev in litellm_env.items():
                  if ek=="CLOUDFRONT_HOST":continue
                  flag="--set-string" if "{" in str(ev) else "--set"
                  # Helm --set-string interprets {} as array; use --set-json for dict values
                  if "{" in str(ev) and ":" in str(ev):
                    cmd+=["--set-json",f'envVars.{ek}={json.dumps(ev)}']
                  else:
                    cmd+=[flag,f"envVars.{ek}={ev}"]
                # Args for IPv6 binding + num_workers for parallel processing
                cmd+=["--set-string","args[0]=--config","--set-string","args[1]=/etc/litellm/config.yaml","--set-string","args[2]=--host","--set-string","args[3]=::","--set-string","args[4]=--num_workers","--set-string","args[5]=4"]
                # Proxy config (model list): (model_name, litellm model path, extra litellm_params)
                # Claude models route via the Bedrock Converse API using global
                # cross-region inference profiles. GPT-5.4/5.5 are only served via
                # the OpenAI-compatible bedrock-mantle endpoint (no Converse
                # support) and are In-Region only, so aws_region_name must be
                # pinned to us-east-2 per the AWS model cards:
                # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-55.html
                models=[
                  ("claude-sonnet-4-6","bedrock/global.anthropic.claude-sonnet-4-6",{}),
                  ("claude-opus-4-6","bedrock/global.anthropic.claude-opus-4-6-v1",{}),
                  ("claude-sonnet-4-5-20250929","bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0",{}),
                  ("claude-opus-4-5-20251101","bedrock/global.anthropic.claude-opus-4-5-20251101-v1:0",{}),
                  ("claude-haiku-4-5-20251001","bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0",{}),
                  ("claude-opus-4-8","bedrock/global.anthropic.claude-opus-4-8",{}),
                  ("claude-sonnet-5","bedrock/global.anthropic.claude-sonnet-5",{}),
                  ("claude-fable-5","bedrock/global.anthropic.claude-fable-5",{}),
                  ("gpt-5.4","bedrock_mantle/openai.gpt-5.4",{"aws_region_name":"us-east-2"}),
                  ("gpt-5.5","bedrock_mantle/openai.gpt-5.5",{"aws_region_name":"us-east-2"}),
                ]
                for i,(mn,mp,mx) in enumerate(models):
                  cmd+=["--set",f"proxy_config.model_list[{i}].model_name={mn}","--set",f"proxy_config.model_list[{i}].litellm_params.model={mp}"]
                  for xk,xv in mx.items():
                    cmd+=["--set",f"proxy_config.model_list[{i}].litellm_params.{xk}={xv}"]
                # Wildcard: allow all bedrock models via pass-through
                idx=len(models)
                cmd+=["--set",f"proxy_config.model_list[{idx}].model_name=bedrock/*","--set",f"proxy_config.model_list[{idx}].litellm_params.model=bedrock/*","--set",f"proxy_config.model_list[{idx}].litellm_params.aws_region_name={props.get('BedrockWildcardRegion','us-west-2')}"]
                cmd+=["--set","proxy_config.general_settings.master_key=os.environ/PROXY_MASTER_KEY"]
                # Restrict the master key to READ-ONLY (usage/stats): it cannot
                # call models or create/modify keys. The module is mounted at
                # /etc/litellm/ (see volumes/volumeMounts below); LiteLLM resolves
                # custom_auth relative to the config dir. mode=auto => the hook
                # only owns the master-key deny path; all other creds defer to
                # built-in auth. Admins operate via SSO-issued virtual keys.
                cmd+=["--set","proxy_config.general_settings.custom_auth=litellm_master_key_readonly.user_api_key_auth"]
                cmd+=["--set","proxy_config.general_settings.custom_auth_settings.mode=auto"]
                # Mount the custom_auth ConfigMap (created in K8sAppResources).
                cmd+=["--set-json",'volumes=[{"name":"custom-auth","configMap":{"name":"litellm-custom-auth"}}]']
                cmd+=["--set-json",'volumeMounts=[{"name":"custom-auth","mountPath":"/etc/litellm/litellm_master_key_readonly.py","subPath":"litellm_master_key_readonly.py"}]']
                cmd+=["--set","proxy_config.general_settings.forward_client_headers_to_llm_api=false"]
                cmd+=["--set","proxy_config.general_settings.store_prompts_in_spend_logs=true"]
                cmd+=["--set","proxy_config.general_settings.maximum_spend_logs_retention_period=7d"]
                cmd+=["--set","proxy_config.general_settings.proxy_batch_write_at=30"]
                cmd+=["--set","proxy_config.general_settings.disable_error_logs=true"]
                cmd+=["--set","proxy_config.general_settings.allow_requests_on_db_unavailable=true"]
                cmd+=["--set","proxy_config.general_settings.database_connection_pool_limit=24"]
                cmd+=["--set","proxy_config.general_settings.max_parallel_requests=100"]
                cmd+=["--set","proxy_config.general_settings.global_max_parallel_requests=500"]
                cmd+=["--set","proxy_config.litellm_settings.drop_params=true"]
                cmd+=["--set","proxy_config.litellm_settings.set_verbose=false"]
                cmd+=["--set","proxy_config.litellm_settings.json_logs=true"]
                cmd+=["--set","proxy_config.litellm_settings.request_timeout=600"]
                cmd+=["--set","proxy_config.litellm_settings.cache=true"]
                # Security: require every virtual key to carry a budget so a
                # leaked key is self-limiting (capped spend, no open-ended risk).
                # Enforced for team/non-admin key creation; proxy_admin callers
                # bypass required_params (see docs/helm.md §9). Budgets are still
                # enforced at spend time regardless of issuer.
                cmd+=["--set-json",'proxy_config.litellm_settings.key_generation_settings={"team_key_generation":{"required_params":["max_budget","budget_duration"]},"personal_key_generation":{"required_params":["max_budget","budget_duration"]}}']
                # Valkey/Redis cache via ElastiCache Serverless
                valkey_host=props.get("ValkeyHost","")
                valkey_port=props.get("ValkeyPort","6379")
                valkey_pw=props.get("ValkeyPassword","")
                if valkey_host:
                  cmd+=["--set",f"proxy_config.litellm_settings.cache_params.type=redis"]
                  cmd+=["--set",f"proxy_config.litellm_settings.cache_params.host={valkey_host}"]
                  cmd+=["--set",f"proxy_config.litellm_settings.cache_params.port={valkey_port}"]
                  cmd+=["--set",f"proxy_config.litellm_settings.cache_params.password={valkey_pw}"]
                  cmd+=["--set","proxy_config.litellm_settings.cache_params.ssl=true"]
                  cmd+=["--set","proxy_config.litellm_settings.cache_params.ttl=600"]
                  cmd+=["--set",f"proxy_config.router_settings.redis_host={valkey_host}"]
                  cmd+=["--set",f"proxy_config.router_settings.redis_port={valkey_port}"]
                  cmd+=["--set",f"proxy_config.router_settings.redis_password={valkey_pw}"]
                  cmd+=["--set","proxy_config.router_settings.routing_strategy=simple-shuffle"]
                  cmd+=["--set-string",f"envVars.REDIS_HOST={valkey_host}"]
                  cmd+=["--set-string",f"envVars.REDIS_PORT={valkey_port}"]
                  cmd+=["--set-string",f"envVars.REDIS_PASSWORD={valkey_pw}"]
                  cmd+=["--set-string","envVars.REDIS_SSL=True"]
                # Static LiteLLM helm values (split by type)
                # NOTE: NO "masterkey" is set here. Instead we point the chart at the
                # pre-created, INTENTIONALLY EMPTY "litellm-masterkey" Secret (see
                # K8sAppResources) via masterkeySecretName/masterkeySecretKey. This
                # both (a) suppresses the chart's default behaviour of auto-generating
                # a random "sk-..." master key Secret, and (b) leaves the injected
                # PROXY_MASTER_KEY env var empty, so LiteLLM has NO functional master
                # key — all admin/inference endpoints return 401 and auth is handled
                # exclusively via Cognito SSO. Verified empirically on EKS.
                for sk,sv in {"masterkeySecretName":"litellm-masterkey","masterkeySecretKey":"masterkey","service.type":"ClusterIP","service.port":"4000","serviceAccount.create":"false","serviceAccount.name":"litellm-sa","db.useExisting":"true","db.deployStandalone":"false","db.secret.name":"postgres-creds","db.secret.usernameKey":"username","db.secret.passwordKey":"password","migrationJob.enabled":"true","redis.enabled":"false","ingress.enabled":"false","nodeSelector.kubernetes\\.io/arch":"arm64","startupProbe.path":"/health/readiness","startupProbe.initialDelaySeconds":"30","startupProbe.periodSeconds":"10","startupProbe.failureThreshold":"60","livenessProbe.path":"/health/liveliness","readinessProbe.path":"/health/readiness","strategy.type":"RollingUpdate"}.items():
                  cmd+=["--set",f"{sk}={sv}"]
                # Production sizing. Memory request 5Gi matches the ~3.7Gi idle
                # baseline of num_workers=4 plus headroom, so the scheduler packs
                # pods honestly (no node oversubscription -> no cascading OOM).
                # Limit 8Gi absorbs concurrency / long-context spikes without
                # OOMKill. CPU request 1 gives the HPA a meaningful 70% base
                # (=700m); limit 4 lets a busy pod use spare cores.
                for sk,sv in {"resources.requests.cpu":"1000m","resources.requests.memory":"5Gi","resources.limits.cpu":"4000m","resources.limits.memory":"8Gi"}.items():
                  cmd+=["--set-string",f"{sk}={sv}"]
                for sk,sv in {"strategy.rollingUpdate.maxUnavailable":"0","strategy.rollingUpdate.maxSurge":"1"}.items():
                  cmd+=["--set",f"{sk}={sv}"]
                # TopologySpreadConstraints for multi-AZ distribution
                cmd+=["--set-json","topologySpreadConstraints=[{\"maxSkew\":1,\"topologyKey\":\"topology.kubernetes.io/zone\",\"whenUnsatisfiable\":\"DoNotSchedule\",\"labelSelector\":{\"matchLabels\":{\"app.kubernetes.io/name\":\"litellm\"}}},{\"maxSkew\":2,\"topologyKey\":\"kubernetes.io/hostname\",\"whenUnsatisfiable\":\"ScheduleAnyway\",\"labelSelector\":{\"matchLabels\":{\"app.kubernetes.io/name\":\"litellm\"}}}]"]
              L.info(f"Running: {' '.join(cmd[:8])}...")
              r=subprocess.run(cmd,capture_output=True,text=True,env=env,timeout=540)
              L.info(f"stdout: {r.stdout}")
              if r.returncode!=0:
                L.error(f"stderr: {r.stderr}")
                send_cfn(event,ctx,"FAILED",reason=r.stderr[:256]);return
              # --- SAFETY NET: master key must be strong + never the old public one ---
              # The master key is required (it signs the SSO UI JWT) but is made
              # read-only by the custom_auth hook. Defence-in-depth: after every
              # deploy, scan the litellm namespace and, if any "*masterkey*" Secret
              # holds the historical hardcoded/public value (or an empty value that
              # would break SSO login), replace it with a strong random key and
              # restart the deployment. Non-fatal (best-effort).
              if props.get("LiteLLMConfig"):
                try:
                  import secrets as _secrets
                  BANNED={"sk-litellm-proxy-master-key",""}  # public/legacy + empty
                  http=urllib3.PoolManager(cert_reqs="CERT_REQUIRED",ca_certs=ca_file.name)
                  tok=get_token(sess,cn,region)
                  hd_g={"Authorization":f"Bearer {tok}","Accept":"application/json"}
                  sr=http.request("GET",f"{ep}/api/v1/namespaces/{ns}/secrets",headers=hd_g)
                  rotated=False
                  if sr.status==200:
                    for s in json.loads(sr.data.decode()).get("items",[]):
                      snm=s.get("metadata",{}).get("name","")
                      if "masterkey" not in snm.lower():continue
                      data=s.get("data",{}) or {}
                      fix={}
                      for dk,dv in data.items():
                        try:val=base64.b64decode(dv).decode() if dv else ""
                        except Exception:val="?"
                        if val.strip() in BANNED:
                          fix[dk]=base64.b64encode(f"sk-cnf-{_secrets.token_urlsafe(32)}".encode()).decode()
                      if fix:
                        L.warning(f"Master key Secret '{snm}' had weak/banned value(s) {list(fix.keys())}; rotating to strong random")
                        patch=json.dumps({"data":fix}).encode()
                        hd_p={"Authorization":f"Bearer {tok}","Content-Type":"application/merge-patch+json","Accept":"application/json"}
                        pr=http.request("PATCH",f"{ep}/api/v1/namespaces/{ns}/secrets/{snm}",headers=hd_p,body=patch)
                        L.info(f"Rotate Secret {snm}: HTTP {pr.status}");rotated=True
                      else:
                        L.info(f"Master key Secret '{snm}' is strong (OK)")
                  else:
                    L.warning(f"Secret list for master-key scan returned HTTP {sr.status}")
                  if rotated:
                    tok=get_token(sess,cn,region)
                    hd_r={"Authorization":f"Bearer {tok}","Content-Type":"application/strategic-merge-patch+json","Accept":"application/json"}
                    rp=json.dumps({"spec":{"template":{"metadata":{"annotations":{"cnf.masterkey/rotatedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}}}}}).encode()
                    rr=http.request("PATCH",f"{ep}/apis/apps/v1/namespaces/{ns}/deployments/{release}",headers=hd_r,body=rp)
                    L.info(f"Restart deployment {release} after rotate: HTTP {rr.status}")
                except Exception as mke:
                  L.warning(f"Master key safety-net (non-fatal): {mke}")
              send_cfn(event,ctx,"SUCCESS",data={"Release":release,"Namespace":ns},pid="helm-deploy")
            except Exception as e:
              L.exception("fail");send_cfn(event,ctx,"FAILED",reason=str(e)[:256])

  HelmDeploy:
    Type: Custom::HelmDeploy
    DependsOn:
      - LiteLLMDeploy
      - CognitoOidcSetup
    Properties:
      ServiceToken: !GetAtt HelmDeployFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      Namespace: !Sub "cnf-${EnvironmentId}"
      ReleaseName: !Sub "cnf-${EnvironmentId}"
      ChartRef: "oci://public.ecr.aws/b1y9i2f3/cnf"
      ChartVersion: "0.2.0"
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref CognitoUserPoolClient
      HelmSets:
        global.gatewayNamespace: envoy-gateway-system
        scaffolding.host.frontend: !GetAtt CloudFrontDistribution.DomainName
        scaffolding.host.backend: !GetAtt GlobalAccelerator.DualStackDnsName
        scaffolding.irsaRoleArn: !GetAtt PodRole.Arn
        scaffolding.rootPath: !Ref AppRootPath

  # --- LiteLLM Helm Deployment ---
  LiteLLMDeploy:
    Type: Custom::HelmDeploy
    DependsOn:
      - K8sAppResources
      - GAHttpsSetup
      - LiteLLMCognitoClient
      - LiteLLMManagedLoginBranding
      - ValkeyCache
    Properties:
      ServiceToken: !GetAtt HelmDeployFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      Namespace: litellm
      ReleaseName: litellm
      ChartRef: "oci://docker.litellm.ai/berriai/litellm-helm"
      ChartVersion: "1.91.0"
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref LiteLLMCognitoClient
      AuroraEndpoint: !GetAtt AuroraCluster.Endpoint.Address
      EnvironmentId: !Ref EnvironmentId
      BedrockWildcardRegion: !FindInMap [BedrockConfig, !Ref "AWS::Region", WildcardRegion]
      ValkeyHost: !GetAtt ValkeyCache.Endpoint.Address
      ValkeyPort: !GetAtt ValkeyCache.Endpoint.Port
      ValkeyPassword: !Sub "${ProjectName}${EnvironmentId}Valkey2026!"
      LiteLLMConfig: "true"
      LiteLLMEnv:
        SERVER_ROOT_PATH: ""
        PROXY_BASE_URL: !Sub "https://${CloudFrontDistribution.DomainName}"
        CLOUDFRONT_HOST: !GetAtt CloudFrontDistribution.DomainName
        GENERIC_CLIENT_STATE: "litellm-sso"
        AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
        GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: "groups"
        GENERIC_ROLE_MAPPINGS_ROLES: "{'proxy_admin': ['admin']}"
        LITELLM_MODE: "PRODUCTION"
        LITELLM_LOG: "ERROR"

  # ============================================================================
  # SECTION 10.1: GA HTTPS RESOURCES (Certificate + Listener + Route)
  # ============================================================================

  # When GA is enabled, create Let's Encrypt cert and HTTPS listener for GA hostname
  GAHttpsSetup:
    Type: Custom::K8sApp
    DependsOn:
      - K8sAppResources
      - GlobalAccelerator
    Properties:
      ServiceToken: !GetAtt KubectlFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      Manifests:
        # --- Certificate for GA hostname ---
        - apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: ga-cert
            namespace: envoy-gateway-system
          spec:
            secretName: ga-https-cert
            issuerRef:
              name: letsencrypt-gateway
              kind: ClusterIssuer
            dnsNames:
              - !GetAtt GlobalAccelerator.DualStackDnsName
        # --- Patch Gateway: https=GA(default) ---
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: eg
            namespace: envoy-gateway-system
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-gateway
          spec:
            gatewayClassName: !Sub "cnf-${EnvironmentId}-eg"
            infrastructure:
              parametersRef:
                group: gateway.envoyproxy.io
                kind: EnvoyProxy
                name: custom-proxy-config
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: All
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: All
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: ga-https-cert
                    - kind: Secret
                      name: eg-https-cert
        # --- ClientTrafficPolicy for HTTP/2 ---
        - apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: ClientTrafficPolicy
          metadata:
            name: enable-h2
            namespace: envoy-gateway-system
          spec:
            targetRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: eg
            connection:
              connectionLimit:
                value: 10000
              maxAcceptPerSocketEvent: 1
            http1:
              preserveHeaderCase: true
            http2:
              initialConnectionWindowSize: 268435456
              initialStreamWindowSize: 268435456
              maxConcurrentStreams: 1000
            timeout:
              http:
                requestReceivedTimeout: 0s

  # ============================================================================
  # SECTION 11: COGNITO OIDC - SecurityPolicy (EnvoyGateway)
  # ============================================================================

  # Lambda to update Cognito callback URLs and create SecurityPolicy
  CognitoSecretFunction:
    Type: AWS::Lambda::Function
    DependsOn: QuotaCheck
    Properties:
      FunctionName: !Sub "${ProjectName}${EnvironmentId}-cognito-setup"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt KubectlLambdaRole.Arn
      Code:
        ZipFile: |
          import base64,json,logging,tempfile,urllib3,boto3
          from botocore.signers import RequestSigner
          L=logging.getLogger();L.setLevel(logging.INFO)
          def send_cfn(event,ctx,status,data=None,reason=None,pid=None):
            body=json.dumps({"Status":status,"Reason":reason or f"Logs: {ctx.log_stream_name}","PhysicalResourceId":pid or event.get("PhysicalResourceId",ctx.log_stream_name),"StackId":event["StackId"],"RequestId":event["RequestId"],"LogicalResourceId":event["LogicalResourceId"],"Data":data or{}})
            urllib3.PoolManager().request("PUT",event["ResponseURL"],body=body.encode(),headers={"Content-Type":""})
          def get_token(sess,cluster,region):
            sts=sess.client("sts",region_name=region);si=sts.meta.service_model.service_id
            sg=RequestSigner(si,region,"sts","v4",sess.get_credentials(),sess.events)
            p={"method":"GET","url":f"https://sts.{region}.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15","body":{},"headers":{"x-k8s-aws-id":cluster},"context":{}}
            u=sg.generate_presigned_url(p,region_name=region,expires_in=60,operation_name="")
            return "k8s-aws-v1."+base64.urlsafe_b64encode(u.encode()).decode().rstrip("=")
          def k8s_apply(http,ep,token,m):
            av=m.get("apiVersion","");kind=m.get("kind","");name=m["metadata"]["name"];ns=m["metadata"].get("namespace")
            PLURALS={"SecurityPolicy":"securitypolicies","Secret":"secrets","HTTPRoute":"httproutes"}
            pl=PLURALS.get(kind,kind.lower()+"s")
            px=f"apis/{av}" if "/" in av else f"api/{av}"
            p=f"/{px}/namespaces/{ns}/{pl}" if ns else f"/{px}/{pl}"
            hd={"Authorization":f"Bearer {token}","Content-Type":"application/json","Accept":"application/json"}
            b=json.dumps(m).encode()
            r=http.request("POST",f"{ep}{p}",headers=hd,body=b)
            if r.status==409:
              hd["Content-Type"]="application/merge-patch+json"
              r=http.request("PATCH",f"{ep}{p}/{name}",headers=hd,body=b)
            L.info(f"k8s_apply {kind}/{name}: {r.status}")
            return r.status
          def handler(event,ctx):
            L.info(json.dumps(event,default=str))
            rt=event["RequestType"];props=event["ResourceProperties"]
            if rt=="Delete":
              send_cfn(event,ctx,"SUCCESS",pid="cognito-setup");return
            try:
              region=props.get("Region",boto3.session.Session().region_name)
              pool_id=props["UserPoolId"];client_id=props["ClientId"]
              cluster=props["ClusterName"];ga_dns=props.get("GADualStackDns","")
              app_root=props.get("AppRootPath","/app")
              gw_ns=props.get("GatewayNamespace","envoy-gateway-system")
              sess=boto3.Session(region_name=region)
              cog=sess.client("cognito-idp")
              # Get client secret
              resp=cog.describe_user_pool_client(UserPoolId=pool_id,ClientId=client_id)
              secret=resp["UserPoolClient"].get("ClientSecret","")
              issuer=f"https://cognito-idp.{region}.amazonaws.com/{pool_id}"
              # Update callback URLs
              callbacks=[];logouts=[]
              cf_domain=props.get("CloudFrontDomain","")
              for d in [cf_domain,ga_dns]:
                if d:
                  callbacks.append(f"https://{d}{app_root}/auth/oidc/callback")
                  logouts.append(f"https://{d}{app_root}/auth/oidc/logout")
              if not callbacks:
                callbacks=["https://localhost"+app_root+"/auth/oidc/callback"];logouts=["https://localhost"+app_root+"/auth/oidc/logout"]
              L.info(f"Updating Cognito callbacks: {callbacks}")
              cog.update_user_pool_client(UserPoolId=pool_id,ClientId=client_id,
                CallbackURLs=callbacks,LogoutURLs=logouts,
                AllowedOAuthFlows=["code"],AllowedOAuthFlowsUserPoolClient=True,
                AllowedOAuthScopes=["openid","profile","email"],
                SupportedIdentityProviders=["COGNITO"],
                ExplicitAuthFlows=["ALLOW_USER_AUTH","ALLOW_USER_SRP_AUTH","ALLOW_REFRESH_TOKEN_AUTH"])
              # --- Create K8s resources for SecurityPolicy ---
              if cluster:
                eks=sess.client("eks");ci=eks.describe_cluster(name=cluster)["cluster"]
                ep=ci["endpoint"];ca=ci["certificateAuthority"]["data"]
                tf=tempfile.NamedTemporaryFile(delete=False,suffix=".crt")
                tf.write(base64.b64decode(ca));tf.flush();tf.close()
                token=get_token(sess,cluster,region)
                http=urllib3.PoolManager(cert_reqs="CERT_REQUIRED",ca_certs=tf.name)
                # K8s Secret with Cognito client secret
                k8s_apply(http,ep,token,{"apiVersion":"v1","kind":"Secret","metadata":{"name":"cognito-oidc-secret","namespace":gw_ns},"type":"Opaque","data":{"client-secret":base64.b64encode(secret.encode()).decode()}})
                # --- GA /apis/v1/: scoped HTTPRoute + SecurityPolicy ---
                if ga_dns:
                  k8s_apply(http,ep,token,{"apiVersion":"gateway.networking.k8s.io/v1","kind":"HTTPRoute","metadata":{"name":"apis-v1-ga","namespace":gw_ns},"spec":{"parentRefs":[{"name":"eg","namespace":gw_ns,"sectionName":"https"}],"hostnames":[ga_dns],"rules":[{"matches":[{"path":{"type":"PathPrefix","value":"/apis/v1/"}}]}]}})
                  k8s_apply(http,ep,token,{"apiVersion":"gateway.envoyproxy.io/v1alpha1","kind":"SecurityPolicy","metadata":{"name":"cognito-oidc-apis-v1","namespace":gw_ns},"spec":{"targetRefs":[{"group":"gateway.networking.k8s.io","kind":"HTTPRoute","name":"apis-v1-ga"}],"oidc":{"provider":{"issuer":issuer},"clientID":client_id,"clientSecret":{"group":"","kind":"Secret","name":"cognito-oidc-secret"},"redirectURL":f"https://{ga_dns}/apis/v1{app_root}/auth/oidc/callback","scopes":["openid","profile","email"],"forwardAccessToken":True}}})
                  L.info("SecurityPolicy cognito-oidc-apis-v1 applied")
              send_cfn(event,ctx,"SUCCESS",data={"CognitoIssuer":issuer,"ClientSecret":secret},pid="cognito-setup")
            except Exception as e:
              L.exception("fail");send_cfn(event,ctx,"FAILED",reason=str(e)[:256])

  CognitoOidcSetup:
    Type: Custom::CognitoSetup
    DependsOn:
      - K8sAppResources
      - CognitoUserPoolClient
      - GAHttpsSetup
    Properties:
      ServiceToken: !GetAtt CognitoSecretFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref CognitoUserPoolClient
      CloudFrontDomain: !GetAtt CloudFrontDistribution.DomainName
      GADualStackDns: !GetAtt GlobalAccelerator.DualStackDnsName
      AppRootPath: !Ref AppRootPath
      GatewayNamespace: envoy-gateway-system

  # ============================================================================
  # SECTION 12: POST-DEPLOY NLB HEALTH CHECK
  # ============================================================================

  # Ensures NLB port 80 listener exists after all Gateway updates.
  # EKS Auto Mode's LB controller can lose listeners during Gateway reconcile.
  NlbHealthCheck:
    Type: Custom::NlbHealthCheck
    DependsOn:
      - HelmDeploy
      - CognitoOidcSetup
    Properties:
      ServiceToken: !GetAtt NlbLookupFunction.Arn
      ClusterName: !Ref EksCluster
      Namespace: !Sub "cnf-${EnvironmentId}"
      Region: !Ref "AWS::Region"
      NlbArn: !GetAtt NlbLookup.NlbArn
      NlbDns: !GetAtt NlbLookup.NlbDns
      RequiredPort: 80
      CloudFrontUrl: !Sub "http://${CloudFrontDistribution.DomainName}/health/readiness"

