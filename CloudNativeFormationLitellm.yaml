  # ============================================================================
  # SECTION 10.1: GA HTTPS RESOURCES (Certificate + Listener + Route)
  # ============================================================================

  # When GA is enabled, create Let's Encrypt cert and HTTPS listener for GA hostname
  GAHttpsSetup:
    Type: Custom::K8sApp
    DependsOn:
      - K8sAppResources
      - GlobalAccelerator
    Properties:
      ServiceToken: !GetAtt KubectlFunction.Arn
      ClusterName: !Ref EksCluster
      Region: !Ref "AWS::Region"
      Manifests:
        # --- Certificate for GA hostname ---
        - apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: ga-cert
            namespace: envoy-gateway-system
          spec:
            secretName: ga-https-cert
            issuerRef:
              name: letsencrypt-gateway
              kind: ClusterIssuer
            dnsNames:
              - !GetAtt GlobalAccelerator.DualStackDnsName
        # --- Patch Gateway: https=GA(default) ---
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: eg
            namespace: envoy-gateway-system
            # NOTE: no cert-manager.io/cluster-issuer annotation (gateway-shim):
            # the listeners have no hostname, so the shim has nothing to issue,
            # and a shim-managed Secret would fight the explicit ga-cert
            # Certificate (GAHttpsSetup). Same as CloudFormation/CloudNativeFormation.yaml.
          spec:
            gatewayClassName: !Sub "cnf-${EnvironmentId}-eg"
            infrastructure:
              parametersRef:
                group: gateway.envoyproxy.io
                kind: EnvoyProxy
                name: custom-proxy-config
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: All
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: All
                tls:
                  mode: Terminate
                  certificateRefs:
                    - kind: Secret
                      name: ga-https-cert
        # --- ClientTrafficPolicy for HTTP/2 ---
        - apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: ClientTrafficPolicy
          metadata:
            name: enable-h2
            namespace: envoy-gateway-system
          spec:
            targetRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: eg
            connection:
              connectionLimit:
                value: 10000
              maxAcceptPerSocketEvent: 1
            http1:
              preserveHeaderCase: true
            http2:
              initialConnectionWindowSize: 268435456
              initialStreamWindowSize: 268435456
              maxConcurrentStreams: 1000
            timeout:
              http:
                requestReceivedTimeout: 0s

  # ============================================================================
  # SECTION 11: POST-DEPLOY NLB HEALTH CHECK
  # ============================================================================

  # Ensures the NLB port 80 listener (HTTP-01 renewals of the GA certificate)
  # exists after all Gateway updates: EKS Auto Mode's LB controller can lose
  # listeners during a Gateway reconcile.
  NlbHealthCheck:
    Type: Custom::NlbHealthCheck
    DependsOn:
      - LiteLLMDeploy
    Properties:
      ServiceToken: !GetAtt NlbLookupFunction.Arn
      ClusterName: !Ref EksCluster
      Namespace: !Sub "cnf-${EnvironmentId}"
      Region: !Ref "AWS::Region"
      NlbArn: !GetAtt NlbLookup.NlbArn
      NlbDns: !GetAtt NlbLookup.NlbDns
      RequiredPort: 80

# ==============================================================================
# OUTPUTS
# ==============================================================================
Outputs:
  StackName:
    Description: "Stack Name"
    Value: !Sub "${ProjectName}${EnvironmentId}"

  VpcId:
    Description: "VPC ID"
    Value: !Ref VPC

  EksClusterName:
    Description: "EKS Cluster Name"
    Value: !Ref EksCluster

  EksClusterEndpoint:
    Description: "EKS Cluster API Endpoint"
    Value: !GetAtt EksCluster.Endpoint

  EfsFileSystemId:
    Description: "EFS File System ID"
    Value: !Ref EfsFileSystem

  CognitoUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool

  CognitoUserPoolClientId:
    Description: "Cognito App Client ID of the LiteLLM SSO"
    Value: !Ref LiteLLMCognitoClient

  CognitoAdminUsername:
    Description: "Cognito Admin Username"
    Value: !GetAtt CognitoAdminUser.Username

  CognitoAdminPassword:
    Description: "Cognito Admin Password (SAVE THIS - shown only once)"
    Value: !GetAtt CognitoAdminUser.Password

  CognitoOidcIssuer:
    Description: "Cognito OIDC Issuer URL"
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"

  PodRoleArn:
    Description: "Pod IAM Role ARN (IRSA/Pod Identity)"
    Value: !GetAtt PodRole.Arn

  NlbDns:
    Description: "EnvoyGateway NLB DNS Name"
    Value: !GetAtt NlbLookup.NlbDns

  CloudFrontDomain:
    Description: "CloudFront Domain Name (frontend host)"
    Value: !GetAtt CloudFrontDistribution.DomainName

  GlobalAcceleratorHost:
    Description: "Global Accelerator Dual-Stack DNS (backend host)"
    Value: !GetAtt GlobalAccelerator.DualStackDnsName

  ValkeyEndpoint:
    Description: "ElastiCache Serverless (Valkey) Endpoint"
    Value: !GetAtt ValkeyCache.Endpoint.Address
  ValkeyPort:
    Description: "ElastiCache Serverless (Valkey) Port"
    Value: !GetAtt ValkeyCache.Endpoint.Port
  ValkeyPassword:
    Description: "Valkey Password"
    Value: !Sub "${ProjectName}${EnvironmentId}Valkey2026!"
  DynamoDBTableName:
    Description: "DynamoDB Sessions Table Name"
    Value: !Ref SessionTable
  AuroraEndpoint:
    Description: "Aurora PostgreSQL Endpoint"
    Value: !GetAtt AuroraCluster.Endpoint.Address
  AuroraUsername:
    Description: "Aurora PostgreSQL Username"
    Value: pgadmin
  AuroraPassword:
    Description: "Aurora PostgreSQL Password"
    Value: !Sub "${ProjectName}${EnvironmentId}Pg2026!"
  LiteLLMApiServer:
    Description: >-
      LiteLLM API base URL (Global Accelerator) - the ONLY endpoint that serves
      model calls (OpenAI /v1/*, Anthropic /v1/messages, ...), with a virtual key.
    Value: !Sub "https://${GlobalAccelerator.DualStackDnsName}/"
  LiteLLMAdminUI:
    Description: >-
      LiteLLM admin UI (CloudFront, Cognito SSO). Model calls through CloudFront
      are refused with 403 (edge_policy.py).
    Value: !Sub "https://${CloudFrontDistribution.DomainName}/ui/"
  LiteLLMMasterKey:
    Description: >-
      LiteLLM master key (READ-ONLY). GET statistics / info routes only; model
      calls and every write (/key/generate, /model/new, ...) return 403
      (access_policy.py), and it cannot sign in to the UI
      (disable_env_credential_login). Model calls need a virtual key created in
      the UI. Value mirrors the litellm-masterkey Secret exactly.
    Value: !Sub
      - "sk-cnf-${Guid}"
      - Guid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
