# LiteLLM Helm values — v1.106.6 (chart oci://docker.litellm.ai/berriai/litellm-helm 1.106.6)
#
# The standalone-Helm form of what CloudNativeFormationLitellm.yaml deploys
# (resource LiteLLMDeploy, whose LiteLLMValues JSON is the source of these
# settings): same image, security settings and model list. Use it to run the
# same LiteLLM on an existing EKS cluster without the stack:
#
#   kubectl create namespace litellm
#   kubectl create secret generic litellm-masterkey -n litellm \
#     --from-literal=masterkey="sk-$(openssl rand -hex 24)"
#   kubectl create secret generic postgres-creds -n litellm \
#     --from-literal=username=<db user> --from-literal=password=<db password>
#   kubectl create secret generic litellm-env -n litellm \
#     --from-literal=GENERIC_CLIENT_SECRET=<cognito app client secret> \
#     --from-literal=REDIS_PASSWORD=<valkey password>
#   kubectl create configmap litellm-policy -n litellm \
#     --from-file=../base/scripts/litellm/access_policy.py
#   helm upgrade --install litellm oci://docker.litellm.ai/berriai/litellm-helm \
#     --version 1.106.6 -n litellm -f values.yaml
#
# and replace every <...> below. Bedrock credentials come from ServiceAccount
# litellm-sa (EKS Pod Identity / IRSA; bedrock:InvokeModel* and
# bedrock-mantle:CreateInference) — no AWS keys anywhere.
#
# Security (as base/templates/labs/litellm.yaml):
#   - model calls only with a virtual key: access_policy.py makes the master key
#     read-only (GET statistics; model calls and writes such as /key/generate ->
#     403) and disable_env_credential_login stops it signing in to the UI;
#   - every team / personal key must carry a budget (key_generation_settings);
#   - no prompt / response text in the spend logs.
# access_policy.py is imported at startup and patch LiteLLM internals of this
# exact version: re-run scripts/e2e-test.sh on every image tag change.
#
# The semantic auto-router and the cost-attribution hook of docs/litellm/ are
# separate add-ons (their own ConfigMaps + callbacks); they are not enabled here.

image:
  repository: ghcr.io/berriai/litellm
  tag: v1.106.6
  pullPolicy: IfNotPresent

# Existing Secret (see above); the chart then creates no master-key Secret.
masterkeySecretName: litellm-masterkey
masterkeySecretKey: masterkey

serviceAccount:
  create: false
  name: litellm-sa

service:
  type: ClusterIP
  port: 4000

# ── Database (Aurora PostgreSQL / RDS) ───────────────────────────
db:
  useExisting: true
  deployStandalone: false
  endpoint: <aurora cluster endpoint>
  database: litellm
  url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)
  secret:
    name: postgres-creds
    usernameKey: username
    passwordKey: password

migrationJob:
  enabled: true
redis:
  enabled: false
ingress:
  enabled: false

# The cluster is IPv6-only: without --host '::' uvicorn binds 0.0.0.0 and every
# probe gets ECONNREFUSED.
args: ["--config", "/etc/litellm/config.yaml", "--host", "::", "--num_workers", "4"]

nodeSelector:
  kubernetes.io/arch: arm64

# 10s timeouts: a saturated worker must not be restarted by its liveness probe.
startupProbe:
  path: /health/readiness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 60
livenessProbe:
  path: /health/liveliness
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  path: /health/readiness
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 25%

# Per pod (num_workers 4, idle ~3.7Gi): memory request == limit, so the node
# never over-commits memory and a neighbour cannot get this pod OOM-killed;
# CPU limit 2x the request for bursts. One pod per m8g.xlarge. Scale with an
# HPA on CPU only (min 3, max 30, 60% of the request) — memory is a fixed
# baseline and a memory target pins the HPA at maxReplicas.
resources:
  requests:
    cpu: 2000m
    memory: 10Gi
  limits:
    cpu: 4000m
    memory: 10Gi

# preStop: Envoy drops the endpoint before the pod stops accepting; grace =
# the 600s request timeout + drain, so a scale-in never cuts a long stream.
terminationGracePeriodSeconds: 660
lifecycle:
  preStop:
    exec:
      command: ["/usr/bin/sleep", "20"]
pdb:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: litellm
  - maxSkew: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: litellm

# The policy callback, next to config.yaml (where LiteLLM resolves them).
volumes:
  - name: litellm-policy
    configMap:
      name: litellm-policy
volumeMounts:
  - name: litellm-policy
    mountPath: /etc/litellm/access_policy.py
    subPath: access_policy.py
    readOnly: true

# Secrets (GENERIC_CLIENT_SECRET, REDIS_PASSWORD) from Secret litellm-env.
environmentSecrets:
  - litellm-env

envVars:
  LITELLM_MODE: PRODUCTION
  LITELLM_LOG: ERROR
  LITELLM_TELEMETRY: "False"
  SERVER_ROOT_PATH: ""
  # The admin UI and the SSO callback are on CloudFront; the API on GA.
  PROXY_BASE_URL: https://<cloudfront domain>
  # Cognito SSO (generic OIDC). Users in the Cognito group `admin` become proxy_admin.
  AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
  GENERIC_CLIENT_ID: <cognito app client id>
  GENERIC_CLIENT_STATE: litellm-sso
  GENERIC_AUTHORIZATION_ENDPOINT: https://<cognito domain>.auth.<region>.amazoncognito.com/oauth2/authorize
  GENERIC_TOKEN_ENDPOINT: https://<cognito domain>.auth.<region>.amazoncognito.com/oauth2/token
  GENERIC_USERINFO_ENDPOINT: https://<cognito domain>.auth.<region>.amazoncognito.com/oauth2/userInfo
  GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
  GENERIC_ROLE_MAPPINGS_ROLES: "{'proxy_admin': ['admin']}"
  PROXY_LOGOUT_URL: https://<cognito domain>.auth.<region>.amazoncognito.com/logout?client_id=<cognito app client id>&logout_uri=https://<cloudfront domain>/ui/
  # ElastiCache Serverless (Valkey): response cache + router state across replicas.
  REDIS_HOST: <valkey endpoint>
  REDIS_PORT: "6379"
  REDIS_SSL: "True"

# ── LiteLLM proxy config (-> /etc/litellm/config.yaml) ───────────
proxy_config:
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    # The master key cannot be the UI password; the UI is entered through SSO.
    disable_env_credential_login: true
    # model_list below is the whole catalogue; the UI cannot add models.
    store_model_in_db: false
    allow_requests_on_db_unavailable: true
    # Per worker: 4 x 10 x 30 pods = 1200 connections (Aurora MaxCapacity 8 ACU).
    database_connection_pool_limit: 10
    maximum_spend_logs_retention_period: 7d
    store_prompts_in_spend_logs: false
    disable_error_logs: true
    forward_client_headers_to_llm_api: false
    proxy_batch_write_at: 30
    max_parallel_requests: 100
    global_max_parallel_requests: 500
  litellm_settings:
    callbacks:
      - access_policy.proxy_handler_instance
    drop_params: true
    set_verbose: false
    json_logs: true
    request_timeout: 600
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
      ssl: true
      ttl: 600
    key_generation_settings:
      team_key_generation:
        required_params: [max_budget, budget_duration]
      personal_key_generation:
        required_params: [max_budget, budget_duration]
  router_settings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
  # The Bedrock models litellm-model-discovery selects for base/
  # (docker/litellm-model-discovery/configs/config.yaml): Claude >= 5.5 via
  # InvokeModel (global profiles, prompt-cache points injected), GPT >= 6 via
  # bedrock-mantle's Responses API in us-east-1, GLM >= 5.3, Kimi >= 3 (no
  # prompt caching on Bedrock), Cohere embed >= 4 — same names, backends,
  # prices and capabilities as it writes (base /model/info, 2026-10-29).
  model_list:
    - model_name: claude-opus-5-5
      litellm_params:
        model: bedrock/invoke/global.anthropic.claude-opus-5-5
        aws_region_name: us-west-2
        input_cost_per_token: 4.0e-06
        output_cost_per_token: 2.0e-05
        cache_read_input_token_cost: 2.0e-07
        cache_creation_input_token_cost: 5.0e-06
        cache_creation_input_token_cost_above_1hr: 8.0e-06
        cache_control_injection_points:
        - role: system
          location: message
        - index: -1
          location: message
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
        max_tokens: 128000
        mode: chat
        supports_adaptive_thinking: true
        supports_computer_use: true
        supports_function_calling: true
        supports_max_reasoning_effort: true
        supports_mid_conversation_system: true
        supports_output_config: true
        supports_parallel_tool_use_config: true
        supports_pdf_input: true
        supports_prompt_caching: true
        supports_reasoning: true
        supports_response_schema: true
        supports_tool_choice: true
        supports_tool_search: true
        supports_vision: true
        supports_xhigh_reasoning_effort: true
